        function gvizUrl(sheetId, sheetName) {
            return `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
        }

        async function fetchSheetData(sheetId, sheetName) {
            for (let attempt = 0; attempt < 3; attempt++) {
                try {
                    const url = gvizUrl(sheetId, sheetName);
                    const res = await fetch(url, { cache: "no-cache" });
                    if (res.status === 429) { 
                        if (attempt < 2) {
                            await new Promise(resolve => setTimeout(resolve, Math.pow(2, attempt) * 1000));
                            continue;
                        }
                        throw new Error("Too many requests to Google Sheets API.");
                    }
                    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
                    const text = await res.text();
                    
                    let jsonText = null;
                    const match = text.match(/setResponse\(([\s\S]*)\);?\s*$/);
                    if (match && match[1]) jsonText = match[1];
                    else {
                        const first = text.indexOf('{');
                        const last = text.lastIndexOf('}');
                        if (first !== -1 && last !== -1 && last > first) jsonText = text.slice(first, last + 1);
                    }

                    if (!jsonText) throw new Error('Could not extract JSON from GViz response.');

                    const data = JSON.parse(jsonText);
                    const cols = (data.table.cols || []).map((c, i) => (c.label || c.id || `col${i}`).toString());
                    const rows = (data.table.rows || []).map((r) => r.c.map((cell) => (cell ? (cell.f !== undefined ? cell.f : cell.v) : null)));
                    return { cols, items: rows };
                } catch (error) {
                    if (attempt === 2) throw error;
                    await new Promise(resolve => setTimeout(resolve, Math.pow(2, attempt) * 1000));
                }
            }
        }

        function findColumnByCandidates(cols, candidates) {
            const lower = cols.map((c) => (c || "").toLowerCase().trim());
            for (let cand of candidates) {
                const target = cand.toLowerCase().trim();
                const idx = lower.findIndex((c) => c === target);
                if (idx >= 0) return cols[idx];
            }
            for (let cand of candidates) {
                const token = cand.toLowerCase().trim();
                const idx = lower.findIndex((c) => c.includes(token));
                if (idx >= 0) return cols[idx];
            }
            return null;
        }

            const n = Number(cleaned);
            if (Number.isNaN(n)) return NaN;
            return isInteger ? Math.round(n) : n;
        }

        function calculateTimeRemaining(targetDate) {
            if (!targetDate) return { days: 0, hours: 0, minutes: 0, seconds: 0, expired: true };
            const now = new Date();
            const difference = targetDate - now;

            const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            
            return { days, hours, minutes, seconds, expired: false };

                                        else if (t.includes('mumbai')) mum += regTotals[k];
                                        else if (t.includes('ajmer')) ajmer += regTotals[k];

                                    scores['Mumbai'] = mum.toFixed(1);
                                    scores['Ajmer'] = ajmer.toFixed(1);

                                                <div className="grid grid-cols-12 items-center px-4 py-3 border-b text-sm font-bold text-slate-500 bg-slate-50 rounded-t-xl uppercase tracking-wider"><div className="col-span-1">Rank</div><div className="col-span-6">Jamia Name</div><div className="col-span-3 text-center">Region</div><div className="col-span-2 text-right text-sky-500">Total Units</div></div>
                                                <div className="space-y-2 mt-2">
                                                    {displayedData.map((it, idx) => ( <div key={idx} className="grid grid-cols-12 items-center gap-4 p-3 rounded-xl bg-white border border-slate-100 shadow-sm hover:shadow-md transition-shadow"><div className="col-span-1 font-bold text-slate-400 text-lg pl-2">#{idx + 1}</div><div className="col-span-6 font-bold text-indigo-600 text-lg">{it.jamiaName}</div><div className="col-span-3 text-center font-bold text-slate-700">{it.region}</div><div className="col-span-2 text-right font-['Bowlby_One_SC'] text-sky-500 text-2xl tracking-wide">{it.units}</div></div> ))}
                                                </div>
                                            </div>
                                        ) : (
                                            <div>
                                                <div className="grid grid-cols-12 items-center px-4 py-3 border-b text-sm font-bold text-slate-500 bg-slate-50 rounded-t-xl uppercase tracking-wider"><div className="col-span-1">Rank</div><div className="col-span-3">Ustaz Name</div><div className="col-span-4">Jamia Name</div><div className="col-span-1 text-center">Region</div><div className="col-span-2 text-right text-emerald-600">Total Amount</div><div className="col-span-1 text-right text-sky-500">Units</div></div>
                                                <div className="space-y-2 mt-2">
                                                    {displayedData.map((it, idx) => (
                                                        <div key={idx} className="grid grid-cols-12 items-center gap-4 p-3 rounded-xl bg-white border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
                                                            <div className="col-span-1 font-bold text-slate-400 text-lg pl-2">#{idx + 1}</div>
                                                            <div className="col-span-3 font-semibold text-slate-800 uppercase">{it.ustazName}</div>
                                                            <div className="col-span-4 font-bold text-indigo-600">{it.jamiaName}</div>
                                                            <div className="col-span-1 text-center"><div className="text-sm font-bold text-slate-700">{it.region}</div></div>
                                                            <div className="col-span-2 text-right font-['Bowlby_One_SC'] text-emerald-600 text-lg tracking-wide">₹{it.amount.toLocaleString('en-IN')}</div>
                                                            <div className="col-span-1 text-right font-bold text-sky-600 bg-sky-50 py-1 px-2 rounded-lg border border-sky-100 text-sm w-fit ml-auto">{it.units}</div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                        {displayedData.length === 0 && !isLoading && ( <div className="text-slate-500 p-8 text-center font-medium bg-slate-50 rounded-xl border border-dashed border-slate-300">Data abhi mojood nahi hai.</div> )}
                                    </div>

                                    <div className="md:hidden space-y-3 mt-4">
                                        {displayedData.map((it, idx) => (
                                            <div key={idx} className="p-4 rounded-xl shadow-sm bg-white border border-slate-100 relative overflow-hidden">
                                                <div className={`absolute top-0 right-0 bg-gradient-to-l ${isClassView ? 'from-indigo-100' : isJamiaView ? 'from-sky-100' : 'from-emerald-100'} to-transparent p-2 rounded-bl-xl ${isClassView ? 'text-indigo-700' : isJamiaView ? 'text-sky-700' : 'text-emerald-700'} font-bold text-sm`}>Rank #{idx + 1}</div>
                                                
                                                {isRegionView ? ( 
                                                    <div><div className="font-bold text-indigo-700 text-xl leading-tight mb-1 uppercase mt-4 pr-16">{it.region}</div>
                                                    <div className="mt-3 flex flex-col"><span className="text-3xl font-['Bowlby_One_SC'] text-sky-500 leading-none">{it.units}</span><span className="text-[10px] font-bold text-slate-400 tracking-widest uppercase mt-1">Total Units</span></div></div>
                                                ) : isClassView ? ( 
                                                    <div><div className="font-bold text-indigo-700 text-xl leading-tight mb-1 uppercase mt-4 pr-16">{it.className}</div>
                                                    <div className="mt-3 flex flex-col"><span className="text-3xl font-['Bowlby_One_SC'] text-sky-500 leading-none">{it.units}</span><span className="text-[10px] font-bold text-slate-400 tracking-widest uppercase mt-1">Total Units</span></div></div>
                                                ) : isJamiaView ? ( 
                                                    <div><div className="font-bold text-indigo-700 text-xl leading-tight mb-1 mt-4 pr-16">{it.jamiaName}</div>
                                                    <div className="mt-3 flex flex-col"><span className="text-3xl font-['Bowlby_One_SC'] text-sky-500 leading-none">{it.units}</span><span className="text-[10px] font-bold text-slate-400 tracking-widest uppercase mt-1">Total Units</span></div></div>
                                                ) : ( 
                                                    <div>
                                                        <div className="border-b pb-3 mb-3 mt-4 pr-16"><div className="font-bold text-slate-800 text-lg uppercase">{it.ustazName}</div><div className="text-xs font-semibold text-indigo-500 mt-1">{it.jamiaName}</div></div>
                                                        <div className="grid grid-cols-3 gap-2 text-sm items-center">
                                                            <div className="col-span-1"><span className="block text-[10px] uppercase text-slate-400 font-bold tracking-wider">Region</span><span className="font-semibold text-slate-600">{it.region || "-"}</span></div>
                                                            <div className="col-span-2 flex flex-col items-end"><span className="text-2xl font-['Bowlby_One_SC'] text-emerald-600 leading-none mb-1">₹{it.amount.toLocaleString('en-IN')}</span><span className="text-xs font-bold text-sky-500 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">{it.units} Units</span></div>
                                                        </div>
                                                    </div> 
                                                )}
                                            </div>
                                        ))}
                                        {displayedData.length === 0 && !isLoading && ( <div className="text-slate-500 p-6 text-center text-sm font-medium bg-slate-50 rounded-xl border border-dashed border-slate-300">Data abhi mojood nahi hai.</div> )}
                                    </div>
                                </div>
                            )}
                        </main>
                        <footer className="mt-8 text-xs text-slate-400 text-center font-medium">Designed for Telethon 2026 — Majlis Talimi Umoor India</footer>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TelethoneDashboard />);
    </script>
</body>
</html>
