       function gvizUrl(sheetId, sheetName) {
    // Har request ko unique banane ke liye aakhir mein '&t=...' lagaya hai taake purana data na aaye
    return `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&t=${new Date().getTime()}`;
}

        async function fetchSheetData(sheetId, sheetName) {
            for (let attempt = 0; attempt < 3; attempt++) {
                try {
                    const url = gvizUrl(sheetId, sheetName);
                    const res = await fetch(url, { cache: "no-cache" });
                    if (res.status === 429) { 
                        if (attempt < 2) {
                            await new Promise(resolve => setTimeout(resolve, Math.pow(2, attempt) * 1000));
                            continue;
                        }
                        throw new Error("Too many requests to Google Sheets API.");
                    }
                    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
                    const text = await res.text();
                    
                    let jsonText = null;
                    const match = text.match(/setResponse\(([\s\S]*)\);?\s*$/);
                    if (match && match[1]) jsonText = match[1];
                    else {
                        const first = text.indexOf('{');
                        const last = text.lastIndexOf('}');
                        if (first !== -1 && last !== -1 && last > first) jsonText = text.slice(first, last + 1);
                    }
                    if (!jsonText) throw new Error('Could not extract JSON.');
                    const data = JSON.parse(jsonText);
                    const cols = (data.table.cols || []).map((c, i) => (c.label || c.id || `col${i}`).toString());
                    const rows = (data.table.rows || []).map((r) => r.c.map((cell) => (cell ? (cell.f !== undefined ? cell.f : cell.v) : null)));
                    return { cols, items: rows };
                } catch (error) {
                    if (attempt === 2) throw error;
                    await new Promise(resolve => setTimeout(resolve, Math.pow(2, attempt) * 1000));
                }
            }
        }

     function findColumnByCandidates(cols, candidates) {
    // Regex /[\s\-]+/g lagane se space aur hyphen dono ignore ho jayenge
    const lower = cols.map((c) => String(c || "").toLowerCase().replace(/[\s\-]+/g, ''));
    for (let cand of candidates) {
        if(!cand) continue;
        const target = String(cand).toLowerCase().replace(/[\s\-]+/g, '');
        const idx = lower.findIndex((c) => c === target);
        if (idx >= 0) return idx; 
    }
    return null;
}

        function parseNumericValue(value) {
            if (value === null || value === undefined || String(value).trim() === "") return NaN;
            const cleaned = String(value).replace(/[^0-9.-]+/g, "");
            const n = Number(cleaned);
            return Number.isNaN(n) ? NaN : n;
        }

        function calculateTimeRemaining(targetDate) {
            if (!targetDate) return { days: 0, hours: 0, minutes: 0, seconds: 0, expired: true };
            const now = new Date();
            const difference = targetDate - now;
            if (difference <= 0) return { days: 0, hours: 0, minutes: 0, seconds: 0, expired: true };
            const seconds = Math.floor((difference / 1000) % 60);
            const minutes = Math.floor((difference / 1000 / 60) % 60);
            const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            return { days, hours, minutes, seconds, expired: false }; 
        }

        function TelethoneDashboard() {
            const availableClasses = ["Ibtidaiya", "Sale Awwal", "Sale Duwam", "Ula", "Saniya", "Salisa", "Rabia", "Khamisa", "Sadisa", "Sabia", "Doratul Hadis", "Takhassusat", "Darulifta Ahle Sunnat"];

            const [activeTab, setActiveTab] = useState("All Jamiaat");
            const [displayedData, setDisplayedData] = useState([]);
            const [resultData, setResultData] = useState({});
            const [muqablaScores, setMuqablaScores] = useState({});
            
            const [isLoading, setIsLoading] = useState(true);
            const [showTop3, setShowTop3] = useState(false);
            const [countdownStr, setCountdownStr] = useState("");
            
            const [posterData, setPosterData] = useState(null);
            const [isDownloading, setIsDownloading] = useState(false);
            const posterContainerRef = useRef(null);

            useEffect(() => {
                if (!adminConfig.timer) {
                    setCountdownStr("Timer Not Set");
                    return;
                }
                const targetDate = new Date(adminConfig.timer);
                const timerId = setInterval(() => {
                    const remaining = calculateTimeRemaining(targetDate);
                    if (remaining.expired) {
                        setCountdownStr("Time Up!");
                        setShowTop3(true);
                    } else {
                        let timeStr = ""; 
                        if(remaining.days > 0) timeStr += `${remaining.days}d `; 
                        timeStr += `${String(remaining.hours).padStart(2, '0')}h ${String(remaining.minutes).padStart(2, '0')}m ${String(remaining.seconds).padStart(2, '0')}s`; 
                        setCountdownStr(timeStr);
                        setShowTop3(false);
                    }
                }, 1000);
                return () => clearInterval(timerId);
            }, [adminConfig.timer]);

            useEffect(() => {
                let pollId;
                const loadData = async () => {
                    let currentTarget = adminConfig.targetCol;
                    let currentMode = adminConfig.displayMode;
                    let currentTimer = adminConfig.timer;

                    // Admin sheet check
                    
try {
    const adminRes = await fetchSheetData(SHEET_ID, "AdminSettings");
    if(adminRes && adminRes.items) {
        adminRes.items.forEach(row => {
            // .toLowerCase() lagane se ab uppercase/lowercase ka masla nahi hoga
            const key = String(row[0] || "").trim().toLowerCase();
            const val = String(row[1] || "").trim();
            if(key === "targetcolumn" && val) currentTarget = val;
            if(key === "displaymode" && val) currentMode = val;
            if(key === "countdowntimer" && val) currentTimer = val;
        });
        setAdminConfig({ targetCol: currentTarget, displayMode: currentMode, timer: currentTimer });
    }
} catch(e) { console.log("Admin Settings Sheet missing or error."); }

                    // Multiday Sum Logic (e.g. "11-Sep, 12-Se, 13-Se")
                    const targetColNames = currentTarget.split(',').map(s => s.trim()).filter(Boolean);

                    if (activeTab === "Muqabla") {
                        try {
                            const scores = {};
                            const classPromises = availableClasses.map(async (cls) => {
                                const cfg = DEFAULT_SHEET_CONFIGS[cls];
                                if (!cfg) return;
                                try {
                                    const { cols, items: rows } = await fetchSheetData(SHEET_ID, cfg.sheet);
                                    const targetColIndices = targetColNames.map(name => findColumnByCandidates(cols, [name])).filter(idx => idx !== null);
                                    let total = 0;
                                    rows.forEach(r => {
                                        targetColIndices.forEach(colIdx => {
                                            const val = parseNumericValue(r[colIdx]);
                                            if (!Number.isNaN(val)) total += val;
                                        });
                                    });
                                    scores[cls] = (total / UNIT_DIVISOR).toFixed(1);
                                } catch(e) {}
                            });
                            
                            const regionCfg = DEFAULT_SHEET_CONFIGS["All Regions"];
                            const regionPromise = async () => {
                                try {
                                    const { cols, items: rows } = await fetchSheetData(SHEET_ID, regionCfg.sheet);
                                    const regCol = findColumnByCandidates(cols, REGION_CANDIDATES);
                                    const targetColIndices = targetColNames.map(name => findColumnByCandidates(cols, [name])).filter(idx => idx !== null);
                                    const regTotals = {};
                                    rows.forEach(r => {
                                        const reg = String(r[regCol] || "").trim();
                                        if (reg) {
                                            targetColIndices.forEach(colIdx => {
                                                const val = parseNumericValue(r[colIdx]);
                                                if (!Number.isNaN(val)) regTotals[reg] = (regTotals[reg] || 0) + val;
                                            });
                                        }
                                    });
                                    let hyd = 0; let kol = 0; let mum = 0; let ajmer = 0; let dehli = 0;
                                    Object.keys(regTotals).forEach(k => {
                                        const t = k.toLowerCase();
                                        if (t.includes('hyd') || t.includes('beng')) hyd += regTotals[k];
                                        else if (t.includes('kol')) kol += regTotals[k];
                                        else if (t.includes('mumbai')) mum += regTotals[k];
                                        else if (t.includes('ajmer')) ajmer += regTotals[k];
                                        else if (t.includes('dehli') || t.includes('delhi')) dehli += regTotals[k];
                                    });
                                    scores['HYD+BENG+KOLKATA'] = ((hyd + kol) / UNIT_DIVISOR).toFixed(1);
                                    scores['Mumbai'] = (mum / UNIT_DIVISOR).toFixed(1);
                                    scores['Ajmer'] = (ajmer / UNIT_DIVISOR).toFixed(1);
                                    scores['Dehli'] = (dehli / UNIT_DIVISOR).toFixed(1);
                                } catch(e) {}

                    }

                                        if(!Number.isNaN(val)) amountValue += val;

                                        id: idx,

                            const { cols, items: rows } = await fetchSheetData(SHEET_ID, cfg.sheet);
                            const ustazCol = findColumnByCandidates(cols, USTAZ_CANDIDATES);
                            const jamiaCol = findColumnByCandidates(cols, JAMIA_CANDIDATES);
                            const regionCol = findColumnByCandidates(cols, REGION_CANDIDATES);
                            const targetColIndices = targetColNames.map(name => findColumnByCandidates(cols, [name])).filter(idx => idx !== null);
                            
                            if(targetColIndices.length === 0) {
                                setDisplayedData([]);
                            } else {
                                const parsed = rows.map((r, idx) => {
                                    let amount = 0;
                                    targetColIndices.forEach(colIdx => {
                                        const val = parseNumericValue(r[colIdx]);
                                        if(!Number.isNaN(val)) amount += val;
                                    });
                                    return {
                                        id: idx,
                                        ustazName: String(r[ustazCol] || "").trim(),
                                        jamiaName: String(r[jamiaCol] || "").trim(),
                                        region: regionCol ? String(r[regionCol]||"").trim() : "",
                                        className: activeTab,
                                        amount: amount,
                                        units: (amount / UNIT_DIVISOR).toFixed(1)
                                    }
                                }).filter(x => x.jamiaName !== "");
                                parsed.sort((a, b) => b.amount - a.amount);
                                setDisplayedData(parsed);
                            }
                        }
                    } catch(e) { console.error(e); } finally { setIsLoading(false); }
                };

                loadData();
                pollId = setInterval(loadData, POLL_INTERVAL_MS);
                return () => clearInterval(pollId);
            }, [activeTab]);

            useEffect(() => {
                if (!posterData) return;
                const generateImage = async () => {
                    await new Promise(resolve => setTimeout(resolve, 2000)); 
                    const element = document.getElementById('poster-to-download');
                    if(element && window.html2canvas) {
                        try {
                            const canvas = await html2canvas(element, { useCORS: true, scale: 2, backgroundColor: null }); 
                            const dataUrl = canvas.toDataURL('image/png'); 
                            const link = document.createElement('a'); 
                            link.href = dataUrl; 
                            link.download = `Telethon_2026_${posterData.className.replace(/\s+/g, '_')}_Leaderboard.png`; 
                            link.click();
                        } catch(err) { alert("Poster banne mein masla aaya hai."); } finally { 
                            setPosterData(null); setIsDownloading(false); 
                        }
                    }
                };
                generateImage();
            }, [posterData]);

            let isJamiaView = activeTab === "All Jamiaat"; 
            let isClassView = activeTab === "All Classes"; 
            let isRegionView = activeTab === "All Regions"; 
            let isSpecialTab = activeTab === "Result" || activeTab === "Muqabla";
            const showAmount = adminConfig.displayMode !== "UnitsOnly";

            const handleDownloadPoster = () => { 
                if(displayedData.length === 0) return; 
                setIsDownloading(true); 
                setPosterData({ className: activeTab, items: displayedData, isJamiaView, isClassView, isRegionView, adminConfig }); 
            };
            const DownloadIcon = () => ( <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/></svg> );

            const muqablaMatchups = [
                { teams: ['Ajmer', 'Dehli'] },
                { teams: ['Mumbai', 'HYD+BENG+KOLKATA'] },
                { teams: ['Ibtidaiya', 'Sale Awwal'] },
                { teams: ['Sale Duwam', 'Ula'] },
                { teams: ['Saniya', 'Salisa'] },
                { teams: ['Rabia', 'Khamisa'] },
                { teams: ['Sadisa', 'Sabia'] },
                { teams: ['Doratul Hadis', 'Takhassusat'] }
            ];

            return (
                <div className="min-h-screen bg-gray-50 pb-10">
                    {posterData && ReactDOM.createPortal(<ListPoster data={posterData} adminConfig={adminConfig} />, posterContainerRef.current)}

                    <div className="max-w-7xl mx-auto p-4 sm:p-6">
                        <header className="mb-8 text-center">
                            <h1 className="text-6xl sm:text-7xl font-['Bebas_Neue'] text-blue-500 tracking-wider uppercase drop-shadow-sm mb-1">TELETHON 2026</h1>
                            <h2 className="text-2xl sm:text-3xl font-['Bebas_Neue'] text-slate-500 tracking-widest uppercase">LIVE LEADERBOARD</h2>
                            <div className="mt-3 inline-block bg-indigo-100 text-indigo-800 px-4 py-1.5 rounded-full font-bold text-sm shadow-sm border border-indigo-200">
                                Data View: {adminConfig.targetCol}
                            </div>
                        </header>

                        <nav className="mb-6">
                            <div className="flex flex-wrap gap-2 justify-center">
                                {allTabs.map((opt) => (
                                   <button key={opt} onClick={() => { setDisplayedData([]); setActiveTab(opt); }} className={`tab-btn px-4 py-2 rounded-full font-semibold text-sm shadow-sm focus:outline-none ${activeTab === opt ? "bg-indigo-600 text-white shadow-md scale-105" : "bg-white text-slate-600 border border-slate-200 hover:bg-slate-100"}`}>
                                        {opt}
                                    </button>
                                ))}
                            </div>
                        </nav>

                        <main className="bg-white border rounded-2xl p-4 sm:p-6 shadow-xl relative min-h-[400px]">
                            {isLoading && (
                                <div className="absolute inset-0 bg-white/80 backdrop-blur-sm z-20 flex justify-center items-center rounded-2xl">
                                    <div className="flex flex-col items-center p-6"><div className="loader w-10 h-10 mb-4 border-t-indigo-500 border-4"></div><span className="text-slate-500 font-semibold animate-pulse">Loading Data...</span></div>
                                </div>
                            )}

                            {activeTab === "Result" && (
                                <div className="text-center p-6 md:p-10 bg-gradient-to-br from-slate-50 to-indigo-50/50 rounded-2xl border border-indigo-100/50">
                                    <div className="animate-fade-in-up">
                                        <h2 className="text-3xl sm:text-4xl font-['Bebas_Neue'] text-indigo-900 tracking-wider mb-4">{countdownStr !== "Time Up!" ? "TIME REMAINING FOR RESULT" : "STATUS"}</h2>
                                        <div className={`text-4xl sm:text-7xl font-mono font-black mb-8 drop-shadow-sm ${countdownStr !== "Time Up!" ? 'text-indigo-600' : 'text-rose-600'}`}>{countdownStr}</div>
                                        {!showTop3 && countdownStr === "Time Up!" && ( <div className="inline-block bg-white px-6 py-3 rounded-full border border-indigo-100 shadow-sm animate-pulse text-xl font-bold text-indigo-600">Result is being prepared... Please wait! ⏳</div> )}
                                        {showTop3 && (
                                            <div className="mt-12 animate-fade-in-up">
                                                <h3 className="text-3xl sm:text-5xl font-['Bebas_Neue'] text-emerald-600 mb-10 tracking-wide bg-emerald-50 py-4 px-8 rounded-2xl inline-block border border-emerald-100 shadow-sm">🎉 MUBARAK HO WINNERS KO! 🎉</h3>
                                                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 text-left">
                                                    {Object.keys(resultData).map((className, i) => {
                                                        const winners = resultData[className];
                                                        return (
                                                        <div key={i} className="bg-white p-5 rounded-2xl shadow-md border border-slate-200 relative overflow-hidden transition-transform hover:-translate-y-1">
                                                            <h4 className="text-xl sm:text-2xl font-['Bowlby_One_SC'] text-indigo-900 mb-4 border-b border-slate-100 pb-3 mt-2">{className}</h4>
                                                            <div className="space-y-3 mb-4">
                                                                {winners.slice(0, 3).map((winner, idx) => {
                                                                    return (
                                                                    <div key={idx} className={`flex items-center gap-3 p-3 rounded-xl border ${idx === 0 ? 'bg-amber-50 border-amber-200' : idx === 1 ? 'bg-slate-50 border-slate-200' : 'bg-orange-50/50 border-orange-200/50'}`}>
                                                                        <div className={`w-8 h-8 shrink-0 rounded-full flex items-center justify-center font-black text-sm ${idx === 0 ? 'bg-amber-400 text-white' : idx === 1 ? 'bg-slate-300 text-slate-700' : 'bg-orange-300 text-orange-900'}`}>#{idx + 1}</div>
                                                                        <div className="flex-1 min-w-0"><div className="font-bold text-slate-800 uppercase truncate text-[13px] sm:text-sm">{winner.ustazName}</div><div className="text-[11px] font-semibold text-indigo-600 truncate">{winner.jamiaName}</div></div>
                                                                        <div className="text-right shrink-0">
                                                                            {showAmount && <div className="font-['Bowlby_One_SC'] text-emerald-600 text-[15px] sm:text-base">₹{winner.amount.toLocaleString('en-IN')}</div>}
                                                                            <div className="text-[10px] font-bold text-sky-500 bg-sky-50 px-2 py-0.5 rounded inline-block mt-0.5">{winner.units} Units</div>
                                                                        </div>
                                                                    </div>
                                                                )})}
                                                            </div>
                                                            <div className="flex flex-wrap gap-2 pt-3 border-t border-slate-100 justify-center">
                                                                <button onClick={() => setPosterData({ isResult: true, type: 3, className: className, items: winners })} className="text-[11px] bg-amber-100 hover:bg-amber-200 text-amber-700 px-3 py-1.5 rounded-lg font-bold transition">Top 3 Poster</button>
                                                            </div>
                                                        </div>
                                                    )})}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {activeTab === "Muqabla" && (
                                <div className="grid grid-cols-1 gap-6">
                                    {muqablaMatchups.map((comp, idx) => (
                                        <div key={idx} className="bg-gradient-to-r from-sky-500 to-indigo-600 p-8 rounded-3xl shadow-xl relative overflow-hidden group hover:shadow-2xl transition-all duration-300">
                                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 bg-white/10 rounded-full blur-3xl group-hover:bg-white/20 transition-all duration-500"></div>
                                            <div className="flex flex-wrap justify-center items-center gap-y-8 relative z-10 w-full">
                                                {comp.teams.map((team, tIdx) => {
                                                    const units = muqablaScores[team] || "0.0";
                                                    return (
                                                    <React.Fragment key={tIdx}>
                                                        <div className="text-center flex flex-col items-center mx-4 min-w-[140px]">
                                                            <span className="text-2xl sm:text-4xl font-black uppercase drop-shadow-md text-white mb-3">{team}</span>
                                                            <span className="bg-white text-indigo-700 px-4 py-1.5 rounded-full font-bold text-xl sm:text-2xl shadow-inner border-2 border-indigo-100">{units} Units</span>
                                                        </div>
                                                        {tIdx < comp.teams.length - 1 && (
                                                            <div className="w-12 h-12 shrink-0 bg-amber-400 text-indigo-900 rounded-full flex items-center justify-center font-black text-xl italic shadow-xl border-4 border-white z-20 mx-2">VS</div>
                                                        )}
                                                    </React.Fragment>
                                                )})}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {!isSpecialTab && (
                                <div>
                                    <div className="flex flex-col sm:flex-row justify-between items-center mb-6 border-b pb-4 gap-4">
                                        <h2 className="text-2xl font-['Bowlby_One_SC'] text-indigo-900 uppercase flex items-center gap-3">
                                            {activeTab} <span className="text-sm bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-['Inter'] font-bold tracking-normal">{displayedData.length} {isClassView ? 'Classes' : isJamiaView ? 'Jamiaat' : isRegionView ? 'Regions' : 'Records'}</span>
                                        </h2>
                                        <button onClick={handleDownloadPoster} disabled={isDownloading || displayedData.length === 0} className="px-4 py-2 text-white bg-gradient-to-r from-sky-500 to-indigo-600 rounded-lg shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2 font-semibold transition">
                                            {isDownloading ? <div className="loader !w-4 !h-4 !border-2 !border-t-white"></div> : <DownloadIcon />} Download Poster
                                        </button>
                                    </div>

                                    <div className="hidden md:block">
                                        {isRegionView ? (
                                            <div>
                                                <div className="grid grid-cols-12 items-center px-4 py-3 border-b text-sm font-bold text-slate-500 bg-slate-50 rounded-t-xl uppercase tracking-wider"><div className="col-span-2">Rank</div><div className="col-span-7">Region Name</div>{showAmount && <div className="col-span-2 text-right">Total Amount</div>}<div className="col-span-1 text-right text-sky-500">Units</div></div>
                                                <div className="space-y-2 mt-2">
                                                    {displayedData.map((it, idx) => ( <div key={idx} className="grid grid-cols-12 items-center gap-4 p-3 rounded-xl bg-white border border-slate-100 shadow-sm hover:shadow-md transition-shadow"><div className="col-span-2 font-bold text-slate-400 text-lg pl-2">#{idx + 1}</div><div className="col-span-7 font-bold text-indigo-600 text-lg uppercase">{it.region}</div>{showAmount && <div className="col-span-2 text-right font-['Bowlby_One_SC'] text-emerald-600 text-xl tracking-wide">₹{it.totalAmount.toLocaleString('en-IN')}</div>}<div className="col-span-1 text-right font-['Bowlby_One_SC'] text-sky-500 text-2xl tracking-wide">{it.units}</div></div> ))}
                                                </div>
                                            </div>
                                        ) : isClassView ? (
                                            <div>
                                                <div className="grid grid-cols-12 items-center px-4 py-3 border-b text-sm font-bold text-slate-500 bg-slate-50 rounded-t-xl uppercase tracking-wider"><div className="col-span-2">Rank</div><div className="col-span-7">Class Name</div>{showAmount && <div className="col-span-2 text-right">Total Amount</div>}<div className="col-span-1 text-right text-sky-500">Units</div></div>
                                                <div className="space-y-2 mt-2">
                                                    {displayedData.map((it, idx) => ( <div key={idx} className="grid grid-cols-12 items-center gap-4 p-3 rounded-xl bg-white border border-slate-100 shadow-sm hover:shadow-md transition-shadow"><div className="col-span-2 font-bold text-slate-400 text-lg pl-2">#{idx + 1}</div><div className="col-span-7 font-bold text-indigo-600 text-lg uppercase">{it.className}</div>{showAmount && <div className="col-span-2 text-right font-['Bowlby_One_SC'] text-emerald-600 text-xl tracking-wide">₹{it.totalAmount.toLocaleString('en-IN')}</div>}<div className="col-span-1 text-right font-['Bowlby_One_SC'] text-sky-500 text-2xl tracking-wide">{it.units}</div></div> ))}
                                                </div>
                                            </div>
                                        ) : isJamiaView ? (
                                            <div>
                                                <div className="grid grid-cols-12 items-center px-4 py-3 border-b text-sm font-bold text-slate-500 bg-slate-50 rounded-t-xl uppercase tracking-wider"><div className="col-span-1">Rank</div><div className={showAmount ? "col-span-6" : "col-span-8"}>Jamia Name</div><div className="col-span-2 text-center">Region</div>{showAmount && <div className="col-span-2 text-right">Total Amount</div>}<div className="col-span-1 text-right text-sky-500">Units</div></div>
                                                <div className="space-y-2 mt-2">
                                                    {displayedData.map((it, idx) => ( <div key={idx} className="grid grid-cols-12 items-center gap-4 p-3 rounded-xl bg-white border border-slate-100 shadow-sm hover:shadow-md transition-shadow"><div className="col-span-1 font-bold text-slate-400 text-lg pl-2">#{idx + 1}</div><div className={`${showAmount ? "col-span-6" : "col-span-8"} font-bold text-indigo-600 text-lg`}>{it.jamiaName}</div><div className="col-span-2 text-center font-bold text-slate-700">{it.region}</div>{showAmount && <div className="col-span-2 text-right font-['Bowlby_One_SC'] text-emerald-600 text-xl tracking-wide">₹{it.amount.toLocaleString('en-IN')}</div>}<div className="col-span-1 text-right font-['Bowlby_One_SC'] text-sky-500 text-2xl tracking-wide">{it.units}</div></div> ))}
                                                </div>
                                            </div>
                                        ) : (
                                            <div>
                                                <div className="grid grid-cols-12 items-center px-4 py-3 border-b text-sm font-bold text-slate-500 bg-slate-50 rounded-t-xl uppercase tracking-wider">
                                                    <div className="col-span-1">Rank</div>
                                                    <div className={showAmount ? "col-span-3" : "col-span-4"}>Ustaz Name</div>
                                                    <div className={showAmount ? "col-span-3" : "col-span-4"}>Jamia Name</div>
                                                    <div className="col-span-2 text-center">Region</div>
                                                    {showAmount && <div className="col-span-2 text-right text-emerald-600">Amount</div>}
                                                    <div className="col-span-1 text-right text-sky-500">Units</div>
                                                </div>
                                                <div className="space-y-2 mt-2">
                                                    {displayedData.map((it, idx) => (
                                                        <div key={idx} className="grid grid-cols-12 items-center gap-4 p-3 rounded-xl bg-white border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
                                                            <div className="col-span-1 font-bold text-slate-400 text-lg pl-2">#{idx + 1}</div>
                                                            <div className={`${showAmount ? "col-span-3" : "col-span-4"} font-semibold text-slate-800 uppercase`}>{it.ustazName}</div>
                                                            <div className={`${showAmount ? "col-span-3" : "col-span-4"} font-bold text-indigo-600`}>{it.jamiaName}</div>
                                                            <div className="col-span-2 text-center"><div className="text-sm font-bold text-slate-700">{it.region}</div></div>
                                                            {showAmount && <div className="col-span-2 text-right font-['Bowlby_One_SC'] text-emerald-600 text-lg tracking-wide">₹{it.amount.toLocaleString('en-IN')}</div>}
                                                            <div className="col-span-1 text-right font-bold text-sky-600 bg-sky-50 py-1 px-2 rounded-lg border border-sky-100 text-sm w-fit ml-auto">{it.units}</div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                        {displayedData.length === 0 && !isLoading && ( <div className="text-slate-500 p-8 text-center font-medium bg-slate-50 rounded-xl border border-dashed border-slate-300">Google sheet ke is tab me Data abhi mojood nahi hai.</div> )}
                                    </div>

                                    {/* Mobile View */}
                                    <div className="md:hidden space-y-3 mt-4">
                                        {displayedData.map((it, idx) => (
                                            <div key={idx} className="p-4 rounded-xl shadow-sm bg-white border border-slate-100 relative overflow-hidden">
                                                <div className={`absolute top-0 right-0 bg-gradient-to-l ${isClassView ? 'from-indigo-100' : isJamiaView ? 'from-sky-100' : 'from-emerald-100'} to-transparent p-2 rounded-bl-xl ${isClassView ? 'text-indigo-700' : isJamiaView ? 'text-sky-700' : 'text-emerald-700'} font-bold text-sm`}>Rank #{idx + 1}</div>
                                                
                                                {isRegionView ? ( 
                                                    <div><div className="font-bold text-indigo-700 text-xl leading-tight mb-1 uppercase mt-4 pr-16">{it.region}</div>
                                                    <div className="mt-3 flex justify-between items-end"><div className="flex flex-col"><span className="text-3xl font-['Bowlby_One_SC'] text-sky-500 leading-none">{it.units}</span><span className="text-[10px] font-bold text-slate-400 tracking-widest uppercase mt-1">Units</span></div>{showAmount && <div className="font-['Bowlby_One_SC'] text-emerald-600 text-xl">₹{it.totalAmount.toLocaleString('en-IN')}</div>}</div></div>
                                                ) : isClassView ? ( 
                                                    <div><div className="font-bold text-indigo-700 text-xl leading-tight mb-1 uppercase mt-4 pr-16">{it.className}</div>
                                                    <div className="mt-3 flex justify-between items-end"><div className="flex flex-col"><span className="text-3xl font-['Bowlby_One_SC'] text-sky-500 leading-none">{it.units}</span><span className="text-[10px] font-bold text-slate-400 tracking-widest uppercase mt-1">Units</span></div>{showAmount && <div className="font-['Bowlby_One_SC'] text-emerald-600 text-xl">₹{it.totalAmount.toLocaleString('en-IN')}</div>}</div></div>
                                                ) : isJamiaView ? ( 
                                                    <div><div className="font-bold text-indigo-700 text-xl leading-tight mb-1 mt-4 pr-16">{it.jamiaName}</div>
                                                    <div className="mt-3 flex justify-between items-end"><div className="flex flex-col"><span className="text-3xl font-['Bowlby_One_SC'] text-sky-500 leading-none">{it.units}</span><span className="text-[10px] font-bold text-slate-400 tracking-widest uppercase mt-1">Units</span></div>{showAmount && <div className="font-['Bowlby_One_SC'] text-emerald-600 text-xl">₹{it.amount.toLocaleString('en-IN')}</div>}</div></div>
                                                ) : ( 
                                                    <div>
                                                        <div className="border-b pb-3 mb-3 mt-4 pr-16"><div className="font-bold text-slate-800 text-lg uppercase">{it.ustazName}</div><div className="text-xs font-semibold text-indigo-500 mt-1">{it.jamiaName}</div></div>
                                                        <div className="grid grid-cols-3 gap-2 text-sm items-center">
                                                            <div className="col-span-1"><span className="block text-[10px] uppercase text-slate-400 font-bold tracking-wider">Region</span><span className="font-semibold text-slate-600">{it.region || "-"}</span></div>
                                                            <div className="col-span-2 flex flex-col items-end">
                                                                {showAmount && <span className="text-2xl font-['Bowlby_One_SC'] text-emerald-600 leading-none mb-1">₹{it.amount.toLocaleString('en-IN')}</span>}
                                                                <span className="text-xs font-bold text-sky-500 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">{it.units} Units</span>
                                                            </div>
                                                        </div>
                                                    </div> 
                                                )}
                                            </div>
                                        ))}
                                        {displayedData.length === 0 && !isLoading && ( <div className="text-slate-500 p-6 text-center text-sm font-medium bg-slate-50 rounded-xl border border-dashed border-slate-300">Data abhi mojood nahi hai for {adminConfig.targetCol}.</div> )}
                                    </div>
                                </div>
                            )}
                        </main>
                        <footer className="mt-8 text-xs text-slate-400 text-center font-medium">Designed for Telethon 2026 — Majlis Talimi Umoor India</footer>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TelethoneDashboard />);
    </script>
</body>
</html>
