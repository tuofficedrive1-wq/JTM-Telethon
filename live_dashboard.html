    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Aapki sheet ID yahan set karein
        const SHEET_ID = "1eY3TG5dIfUPsrx0CRwrv9H0HlkzRTjbWsXw2ypVAXCA";

        const DEFAULT_SHEET_CONFIGS = {
            "AdminSettings": { id: 1eY3TG5dIfUPsrx0CRwrv9H0HlkzRTjbWsXw2ypVAXCA, sheet: "AdminSettings" },
            "Ibtidaiya": { id: 1eY3TG5dIfUPsrx0CRwrv9H0HlkzRTjbWsXw2ypVAXCA, sheet: "Ibtidaiya" },
            "Sale Awwal": { id: SHEET_ID, sheet: "Sale Awwal" },
            "Sale Duwam": { id: SHEET_ID, sheet: "Sale Duwam" },
            "Ula": { id: SHEET_ID, sheet: "Ula" },
            "Saniya": { id: SHEET_ID, sheet: "Saniya" },
            "Salisa": { id: SHEET_ID, sheet: "Salisa" },
            "Rabia": { id: SHEET_ID, sheet: "Rabia" },
            "Khamisa": { id: SHEET_ID, sheet: "Khamisa" },
            "Sadisa": { id: SHEET_ID, sheet: "Sadisa" },
            "Sabia": { id: SHEET_ID, sheet: "Sabia" },
            "Doratul Hadis": { id: SHEET_ID, sheet: "Daurul Hadis" },
            "Takhassusat": { id: SHEET_ID, sheet: "Takhassusat" },
            "Darulifta Ahle Sunnat": { id: SHEET_ID, sheet: "Darul Ifta" },
            "All Jamiaat": { id: SHEET_ID, sheet: "JAMIA" },
            "All Regions": { id: SHEET_ID, sheet: "REGION M" }
        };

        const POLL_INTERVAL_MS = 5000;
        const UNIT_DIVISOR = 7000;

        const RANK_CANDIDATES = ["Rank", "S. R.", "S.R.", "S R", "Sr", "Serial", "S No", "S.No"];
        const USTAZ_CANDIDATES = ["Ustaz Name", "USTAZ NAME", "Ustaz", "Ustad", "Instructor", "Teacher", "Class"];
        const JAMIA_CANDIDATES = ["Jamia Name", "JAMIA NAME", "Jamia", "Jamiah"];
        const REGION_CANDIDATES = ["Region", "REGION", "Zone"];

        function gvizUrl(sheetId, sheetName) {
            return `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
        }

        async function fetchSheetData(sheetId, sheetName) {
            for (let attempt = 0; attempt < 3; attempt++) {
                try {
                    const url = gvizUrl(sheetId, sheetName);
                    const res = await fetch(url, { cache: "no-cache" });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const text = await res.text();
                    
                    let jsonText = null;
                    const match = text.match(/setResponse\(([\s\S]*)\);?\s*$/);
                    if (match && match[1]) jsonText = match[1];
                    else {
                        const first = text.indexOf('{');
                        const last = text.lastIndexOf('}');
                        if (first !== -1 && last !== -1 && last > first) jsonText = text.slice(first, last + 1);
                    }
                    const data = JSON.parse(jsonText);
                    const cols = (data.table.cols || []).map((c, i) => (c.label || c.id || `col${i}`).toString());
                    const rows = (data.table.rows || []).map((r) => r.c.map((cell) => (cell ? (cell.f !== undefined ? cell.f : cell.v) : null)));
                    return { cols, items: rows };
                } catch (error) {
                    if (attempt === 2) throw error;
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }
            }
        }

        function findColumnIndexByCandidates(cols, candidates) {
            const lower = cols.map(c => (c || "").toLowerCase().trim());
            for (let cand of candidates) {
                const target = cand.toLowerCase().trim();
                const idx = lower.indexOf(target);
                if (idx >= 0) return idx;
            }
            return -1;
        }

        function parseNumericValue(value) {
            if (!value) return NaN;
            const cleaned = String(value).replace(/[^0-9.-]+/g, "");
            const n = Number(cleaned);
            return Number.isNaN(n) ? NaN : n;
        }

        function calculateTimeRemaining(targetDate) {
            if (!targetDate) return { days: 0, hours: 0, minutes: 0, seconds: 0, expired: true };
            const now = new Date();
            const difference = targetDate - now;

            if (difference <= 0) return { days: 0, hours: 0, minutes: 0, seconds: 0, expired: true };
            const seconds = Math.floor((difference / 1000) % 60);
            const minutes = Math.floor((difference / 1000 / 60) % 60);
            const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            return { days, hours, minutes, seconds, expired: false }; 
        }

        // --- POSTER COMPONENT ---
        const ListPoster = ({ data }) => {
            if (!data) return null;
            const { className, items, isJamiaView, isClassView, isRegionView, isResult, type, adminSettings } = data;
            const dateStr = new Date().toLocaleDateString('en-IN');
            const showAmount = adminSettings?.displayMode !== "UnitsOnly";

            if (isResult) {
                const topN = items.slice(0, type);
                const isTableOnly = type === 10;
                return (
                    <div id="poster-to-download" style={{ width: '1200px', minHeight: '800px', padding: '40px', background: 'radial-gradient(circle at top, #dbeafe 0%, #e0e7ff 35%, #f3e8ff 70%, #fce7f3 100%)', fontFamily: "'Inter', sans-serif", display: 'flex', flexDirection: 'column' }}>
                        <div style={{ textAlign: 'center', marginBottom: '45px' }}>
                            <h2 style={{ fontFamily: "'Bebas Neue', cursive", fontSize: '60px', color: '#059669', letterSpacing: '3px', margin: 0 }}>CONGRATULATIONS!</h2>
                            <h1 style={{ fontFamily: "'Bowlby One SC', sans-serif", fontSize: '75px', color: '#1e3a8a', margin: '15px 0 10px 0' }}>TELETHON 2026</h1>
                            <div style={{ marginTop: '10px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '15px' }}>
                                <span style={{ fontFamily: "'Bebas Neue', cursive", fontSize: '38px', color: '#475569' }}>TOP {type} WINNERS -</span>
                                <span style={{ fontFamily: "'Poppins', sans-serif", fontSize: '36px', fontWeight: '800', color: '#4338ca' }}>{className}</span>
                            </div>
                        </div>

                        <div style={{ flexGrow: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                            {isTableOnly ? (
                                <div style={{width: '100%'}}>
                                    <div style={{ display: 'grid', gridTemplateColumns: '80px 2fr 2fr 1fr', alignItems: 'center', gap: '16px', padding: '16px', background: '#1e3a8a', color: 'white', borderRadius: '12px', fontWeight: 'bold', fontSize: '20px', textTransform: 'uppercase' }}>
                                        <span>Rank</span><span>Ustaz Name</span><span>Jamia Name</span><span style={{textAlign: 'right'}}>Units</span>
                                    </div>
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', marginTop: '12px' }}>
                                        {topN.map((it, idx) => (
                                            <div key={idx} style={{ display: 'grid', gridTemplateColumns: '80px 2fr 2fr 1fr', alignItems: 'center', gap: '16px', padding: '16px', background: 'rgba(255,255,255,0.9)', borderRadius: '12px', fontSize: '22px', fontWeight: 700 }}>
                                                <span style={{color: '#64748b'}}>#{idx + 1}</span><span style={{color: '#1e293b', textTransform: 'uppercase'}}>{it.ustazName}</span><span style={{color: '#4338ca'}}>{it.jamiaName}</span><span style={{textAlign: 'right', color: '#0ea5e9'}}>{it.units}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', gap: '40px' }}>
                                    {topN.map((it, idx) => {
                                        const rankColors = idx === 0 ? '#fbbf24' : idx === 1 ? '#94a3b8' : idx === 2 ? '#d97706' : '#6366f1';
                                        return (
                                        <div key={idx} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '15px', padding: '30px', background: 'rgba(255,255,255,0.95)', borderRadius: '24px', position: 'relative', width: '320px', borderTop: `10px solid ${rankColors}` }}>
                                            <div style={{ position: 'absolute', top: '-30px', width: '60px', height: '60px', background: rankColors, color: 'white', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '28px', fontWeight: 'bold' }}>{idx + 1}</div>
                                            <div style={{ textAlign: 'center', width: '100%', marginTop: '30px' }}>
                                                <h3 style={{ margin: 0, fontSize: '26px', color: '#1e293b', textTransform: 'uppercase' }}>{it.ustazName}</h3>
                                                <p style={{ margin: '8px 0', fontSize: '18px', color: '#4338ca', fontWeight: '600' }}>{it.jamiaName}</p>
                                                {showAmount && <div style={{ fontSize: '24px', color: '#059669', fontWeight: 'bold', margin: '10px 0' }}>₹{it.amount.toLocaleString('en-IN')}</div>}
                                                <div style={{ display: 'inline-block', background: '#e0f2fe', color: '#0284c7', padding: '8px 16px', borderRadius: '10px', fontWeight: 'bold', fontSize: '20px' }}>{it.units} Units</div>
                                            </div>
                                        </div>
                                    )})}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }
            return (
                <div id="poster-to-download" style={{ width: '1200px', minHeight: '800px', padding: '40px', background: 'linear-gradient(135deg, #f0f9ff, #eef2ff)', fontFamily: "'Inter', sans-serif", display: 'flex', flexDirection: 'column' }}>
                    <div style={{ textAlign: 'center', marginBottom: '30px' }}>
                        <h1 style={{ fontFamily: "'Bebas Neue', cursive", fontSize: '72px', color: '#1e3a8a', margin: 0 }}>TELETHON 2026 LEADERBOARD</h1>
                        <p style={{ fontFamily: "'Bebas Neue', cursive", fontSize: '38px', color: '#6366f1', margin: '-5px 0 10px 0' }}>
                            {isClassView ? "OVERALL CLASSES RANKING" : isJamiaView ? "OVERALL JAMIAAT RANKING" : isRegionView ? "OVERALL REGION RANKING" : `ASATIZA RECORD - ${className}`}
                        </p>
                        <div style={{ fontWeight: 'bold', color: '#475569', fontSize: '20px' }}>Data For: {adminSettings?.targetColumn}</div>
                    </div>
                    <div style={{ flexGrow: 1 }}>
                        <div style={{ display: 'grid', gridTemplateColumns: showAmount ? '80px 1.5fr 1.5fr 1fr 1.2fr 100px' : '80px 2fr 2fr 1fr 100px', alignItems: 'center', gap: '16px', padding: '12px 16px', background: '#dbeafe', borderRadius: '12px', fontWeight: 'bold', fontSize: '18px', color: '#1e3a8a', marginBottom: '12px', textTransform: 'uppercase' }}>
                            <span>Rank</span>
                            {!isRegionView && !isClassView && <span>{isJamiaView ? 'Jamia Name' : 'Ustaz Name'}</span>}
                            {!isRegionView && !isClassView && !isJamiaView && <span>Jamia Name</span>}
                            {isClassView && <span>Class Name</span>}
                            {isRegionView && <span>Region Name</span>}
                            {!isClassView && <span style={{textAlign: 'center'}}>Region</span>}
                            {showAmount && <span style={{textAlign: 'right'}}>Total Amount</span>}
                            <span style={{textAlign: 'right'}}>Units</span>
                        </div>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                            {items.map((it, idx) => (
                                <div key={idx} style={{ display: 'grid', gridTemplateColumns: showAmount ? '80px 1.5fr 1.5fr 1fr 1.2fr 100px' : '80px 2fr 2fr 1fr 100px', alignItems: 'center', gap: '16px', padding: '16px', background: 'rgba(255,255,255,0.8)', borderRadius: '12px', fontSize: '20px', color: '#1e293b', fontWeight: 600 }}>
                                    <span style={{color: '#64748b', fontSize:'24px', fontWeight:'bold'}}>#{idx + 1}</span>
                                    
                                    {isRegionView && <span style={{textTransform: 'uppercase'}}>{it.region}</span>}
                                    {isClassView && <span style={{textTransform: 'uppercase'}}>{it.className}</span>}
                                    {!isRegionView && !isClassView && <span style={{textTransform: 'uppercase'}}>{it.ustazName || it.jamiaName}</span>}
                                    {!isRegionView && !isClassView && !isJamiaView && <span style={{color: '#4338ca'}}>{it.jamiaName}</span>}
                                    
                                    {!isClassView && <span style={{textAlign: 'center', fontSize: '18px', color: '#64748b'}}>{it.region || "-"}</span>}
                                    
                                    {showAmount && <span style={{textAlign: 'right', color: '#059669', fontSize:'22px'}}>₹{it.amount.toLocaleString('en-IN')}</span>}
                                    <span style={{textAlign: 'right', color: '#0ea5e9'}}>{it.units}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        function TelethoneDashboard() {
            const availableClasses = ["Ibtidaiya", "Sale Awwal", "Sale Duwam", "Ula", "Saniya", "Salisa", "Rabia", "Khamisa", "Sadisa", "Sabia", "Doratul Hadis", "Takhassusat", "Darulifta Ahle Sunnat"];
            const topTabs = ['All Jamiaat', 'All Classes'];
            const endTabs = ['All Regions', 'Result'];
            const allTabs = [...new Set([...topTabs, ...availableClasses, ...endTabs])];

            const [activeTab, setActiveTab] = useState("All Jamiaat");
            const [displayedData, setDisplayedData] = useState([]);
            const [resultData, setResultData] = useState({});
            const [isLoading, setIsLoading] = useState(true);
            const [showTop3, setShowTop3] = useState(false);
            const [countdownStr, setCountdownStr] = useState("");
            const [posterData, setPosterData] = useState(null);
            const [isDownloading, setIsDownloading] = useState(false);
            const posterContainerRef = useRef(null);

            // ADMIN SETTINGS STATE
            const [adminSettings, setAdminSettings] = useState({
                targetColumn: "05 Sept",
                displayMode: "Both",
                timer: null
            });

            // Countdown Logic
            useEffect(() => {
                if (!adminSettings.timer) {
                    setCountdownStr("Timer Not Set");
                    return;
                }
                const targetDate = new Date(adminSettings.timer);
                const timerId = setInterval(() => {
                    const remaining = calculateTimeRemaining(targetDate);
                    if (remaining.expired) {
                        setCountdownStr("Time Up!");
                        setShowTop3(true);
                    } else {
                        setShowTop3(false);
                        let timeStr = ""; 
                        if(remaining.days > 0) timeStr += `${remaining.days}d `; 
                        timeStr += `${remaining.hours}h ${remaining.minutes}m ${remaining.seconds}s`; 
                        setCountdownStr(timeStr);
                    }
                }, 1000);
                return () => clearInterval(timerId);
            }, [adminSettings.timer]);

            // Data Fetching Logic
            useEffect(() => {
                let pollId;
                
                const loadData = async () => {
                    try {
                        // 1. Fetch Admin Settings First
                        const adminCfg = DEFAULT_SHEET_CONFIGS["AdminSettings"];
                        let currentTargetCol = "05 Sept";
                        let currentDisplayMode = "Both";
                        let currentTimer = null;

                        try {
                            const { items: adminRows } = await fetchSheetData(adminCfg.id, adminCfg.sheet);
                            adminRows.forEach(r => {
                                const key = String(r[0] || "").trim();
                                const val = String(r[1] || "").trim();
                                if(key === "TargetColumn") currentTargetCol = val || "05 Sept";
                                if(key === "DisplayMode") currentDisplayMode = val || "Both";
                                if(key === "CountdownTimer") currentTimer = val || null;
                            });
                            setAdminSettings({ targetColumn: currentTargetCol, displayMode: currentDisplayMode, timer: currentTimer });
                        } catch(e) { console.log("Admin Settings load fail, using defaults."); }

                        // 2. Fetch specific tab data based on dynamic target column
                        if (activeTab === "Result") {
                            const fetchPromises = availableClasses.map(async (opt) => {
                                const cfg = DEFAULT_SHEET_CONFIGS[opt];
                                if (!cfg) return { className: opt, winners: [] };
                                try {
                                    const { cols, items: rows } = await fetchSheetData(cfg.id, cfg.sheet);
                                    const jamiaIdx = findColumnIndexByCandidates(cols, JAMIA_CANDIDATES);
                                    const ustazIdx = findColumnIndexByCandidates(cols, USTAZ_CANDIDATES);
                                    const amountIdx = findColumnIndexByCandidates(cols, [currentTargetCol]); // Dynamic Column Fetch
                                    
                                    if(amountIdx === -1) return { className: opt, winners: [] };

                                    let parsed = rows.map((r, idx) => {
                                        const value = parseNumericValue(r[amountIdx]);
                                        return {
                                            id: idx,
                                            ustazName: String(r[ustazIdx] || "").trim(),
                                            jamiaName: String(r[jamiaIdx] || "").trim(),
                                            amount: value,
                                            units: (value / UNIT_DIVISOR).toFixed(1)
                                        };
                                    }).filter(x => x.jamiaName !== "" && !Number.isNaN(x.amount));
                                    parsed.sort((a, b) => b.amount - a.amount);
                                    return { className: opt, winners: parsed.slice(0, 10) };
                                } catch(e) { return { className: opt, winners: [] }; }
                            });
                            const results = await Promise.all(fetchPromises);
                            const winnersMap = {};
                            results.forEach(r => { if (r.winners.length > 0) winnersMap[r.className] = r.winners; });
                            setResultData(winnersMap);
                        } else {
                            // Logic for All Classes, All Regions, All Jamiaat, and Single Class...
                            let finalData = [];
                            
                            if(activeTab === "All Classes") {
                                const promises = availableClasses.map(async (cls) => {
                                    const cfg = DEFAULT_SHEET_CONFIGS[cls];
                                    try {
                                        const { cols, items: rows } = await fetchSheetData(cfg.id, cfg.sheet);
                                        const amountIdx = findColumnIndexByCandidates(cols, [currentTargetCol]);
                                        let total = 0;
                                        if(amountIdx !== -1) {
                                            rows.forEach(r => {
                                                const val = parseNumericValue(r[amountIdx]);
                                                if(!Number.isNaN(val)) total += val;
                                            });
                                        }
                                        return { id: cls, className: cls, amount: total, units: (total / UNIT_DIVISOR).toFixed(1) };
                                    } catch(e) { return { className: cls, amount: 0, units: "0.0" }; }
                                });
                                finalData = await Promise.all(promises);
                                finalData.sort((a, b) => b.amount - a.amount);
                            } 
                            else if(activeTab === "All Regions" || activeTab === "All Jamiaat" || availableClasses.includes(activeTab)) {
                                // Unified approach: fetch from specific sheet
                                const sheetKey = activeTab === "All Regions" ? "All Regions" : (activeTab === "All Jamiaat" ? "All Jamiaat" : activeTab);
                                const cfg = DEFAULT_SHEET_CONFIGS[sheetKey];
                                const { cols, items: rows } = await fetchSheetData(cfg.id, cfg.sheet);
                                
                                const regIdx = findColumnIndexByCandidates(cols, REGION_CANDIDATES);
                                const jamiaIdx = findColumnIndexByCandidates(cols, JAMIA_CANDIDATES);
                                const ustazIdx = findColumnIndexByCandidates(cols, USTAZ_CANDIDATES);
                                const amountIdx = findColumnIndexByCandidates(cols, [currentTargetCol]); // Dynamic

                                if(activeTab === "All Regions") {
                                    const regTotals = {};
                                    if(amountIdx !== -1) {
                                        rows.forEach(r => {
                                            const reg = String(r[regIdx] || "").trim();
                                            const val = parseNumericValue(r[amountIdx]);
                                            if(reg && !Number.isNaN(val)) regTotals[reg] = (regTotals[reg] || 0) + val;
                                        });
                                    }
                                    finalData = Object.keys(regTotals).map(reg => ({ id: reg, region: reg, amount: regTotals[reg], units: (regTotals[reg] / UNIT_DIVISOR).toFixed(1) }));
                                } 
                                else if(activeTab === "All Jamiaat") {
                                    if(amountIdx !== -1) {
                                        finalData = rows.map((r, idx) => {
                                            const val = parseNumericValue(r[amountIdx]);
                                            return { id: idx, jamiaName: String(r[jamiaIdx] || "").trim(), region: String(r[regIdx] || "").trim(), amount: val, units: (val / UNIT_DIVISOR).toFixed(1) };
                                        }).filter(x => x.jamiaName !== "" && !Number.isNaN(x.amount));
                                    }
                                } 
                                else {
                                    if(amountIdx !== -1) {
                                        finalData = rows.map((r, idx) => {
                                            const val = parseNumericValue(r[amountIdx]);
                                            return { id: idx, ustazName: String(r[ustazIdx] || "").trim(), jamiaName: String(r[jamiaIdx] || "").trim(), region: String(r[regIdx] || "").trim(), amount: val, units: (val / UNIT_DIVISOR).toFixed(1) };
                                        }).filter(x => x.jamiaName !== "" && !Number.isNaN(x.amount));
                                    }
                                }
                                finalData.sort((a, b) => b.amount - a.amount);
                            }
                            setDisplayedData(finalData);
                        }
                    } catch(e) { console.error(e); } finally { setIsLoading(false); }
                };

                loadData();
                pollId = setInterval(loadData, POLL_INTERVAL_MS);
                return () => clearInterval(pollId);
            }, [activeTab]);

            // Poster Generator
            useEffect(() => {
                if (!posterData) return;
                const generateImage = async () => {
                    await new Promise(resolve => setTimeout(resolve, 1000)); 
                    const element = document.getElementById('poster-to-download');
                    if(element && window.html2canvas) {
                        try {
                            const canvas = await html2canvas(element, { useCORS: true, scale: 2 }); 
                            const link = document.createElement('a'); 
                            link.href = canvas.toDataURL('image/png'); 
                            link.download = `Telethon_${posterData.className}.png`; 
                            link.click();
                        } catch(err) {} finally { setPosterData(null); setIsDownloading(false); }
                    }
                };
                generateImage();
            }, [posterData]);

            const showAmount = adminSettings.displayMode !== "UnitsOnly";
            let isJamiaView = activeTab === "All Jamiaat"; 
            let isClassView = activeTab === "All Classes"; 
            let isRegionView = activeTab === "All Regions"; 
            let isSpecialTab = activeTab === "Result";

            return (
                <div className="min-h-screen bg-gray-50 pb-10">
                    {posterData && ReactDOM.createPortal(<ListPoster data={posterData} />, posterContainerRef.current)}

                    <div className="max-w-7xl mx-auto p-4 sm:p-6">
                        <header className="mb-8 text-center">
                            <h1 className="text-6xl sm:text-7xl font-['Bebas_Neue'] text-blue-500 tracking-wider uppercase mb-1">TELETHON 2026</h1>
                            <h2 className="text-2xl sm:text-3xl font-['Bebas_Neue'] text-slate-500 tracking-widest uppercase">LIVE LEADERBOARD</h2>
                            <div className="inline-block mt-3 px-4 py-1 bg-indigo-100 text-indigo-800 rounded-full text-sm font-bold shadow-sm border border-indigo-200">
                                Current Data: {adminSettings.targetColumn}
                            </div>
                        </header>

                        <nav className="mb-6 flex flex-wrap gap-2 justify-center">
                            {allTabs.map(opt => (
                                <button key={opt} onClick={() => setActiveTab(opt)} className={`px-4 py-2 rounded-full font-semibold text-sm shadow-sm transition ${activeTab === opt ? "bg-indigo-600 text-white" : "bg-white text-slate-600 border border-slate-200 hover:bg-slate-100"}`}>
                                    {opt}
                                </button>
                            ))}
                        </nav>

                        <main className="bg-white border rounded-2xl p-4 sm:p-6 shadow-xl relative min-h-[400px]">
                            {isLoading && (
                                <div className="absolute inset-0 bg-white/80 backdrop-blur-sm z-20 flex justify-center items-center rounded-2xl">
                                    <div className="loader w-10 h-10 border-t-indigo-500 border-4"></div>
                                </div>
                            )}

                            {activeTab === "Result" && (
                                <div className="text-center p-6 bg-gradient-to-br from-slate-50 to-indigo-50/50 rounded-2xl border">
                                    <h2 className="text-3xl font-['Bebas_Neue'] text-indigo-900 tracking-wider mb-4">{countdownStr !== "Time Up!" ? "TIME REMAINING FOR RESULT" : "STATUS"}</h2>
                                    <div className={`text-5xl sm:text-7xl font-mono font-black mb-8 ${countdownStr !== "Time Up!" ? 'text-indigo-600' : 'text-rose-600'}`}>{countdownStr}</div>
                                    
                                    {showTop3 && (
                                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 text-left mt-8">
                                            {Object.keys(resultData).map((cls, i) => (
                                                <div key={i} className="bg-white p-5 rounded-2xl shadow-md border border-slate-200">
                                                    <h4 className="text-xl font-['Bowlby_One_SC'] text-indigo-900 mb-4 border-b pb-2">{cls}</h4>
                                                    <div className="space-y-3 mb-4">
                                                        {resultData[cls].slice(0, 3).map((w, idx) => (
                                                            <div key={idx} className="flex items-center gap-3 p-3 rounded-xl border bg-slate-50">
                                                                <div className="w-8 h-8 rounded-full bg-slate-800 text-white flex items-center justify-center font-bold">#{idx + 1}</div>
                                                                <div className="flex-1"><div className="font-bold text-sm uppercase">{w.ustazName}</div><div className="text-xs text-indigo-600">{w.jamiaName}</div></div>
                                                                <div className="text-right">
                                                                    {showAmount && <div className="font-bold text-emerald-600">₹{w.amount.toLocaleString()}</div>}
                                                                    <div className="text-xs font-bold text-sky-500">{w.units} Units</div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                    <div className="flex gap-2 justify-center">
                                                        <button onClick={() => { setIsDownloading(true); setPosterData({ isResult: true, type: 3, className: cls, items: resultData[cls], adminSettings }); }} className="text-xs bg-amber-100 px-3 py-1.5 rounded-lg font-bold">Top 3 Poster</button>
                                                        <button onClick={() => { setIsDownloading(true); setPosterData({ isResult: true, type: 10, className: cls, items: resultData[cls], adminSettings }); }} className="text-xs bg-slate-100 px-3 py-1.5 rounded-lg font-bold">Top 10 Table</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                            {!isSpecialTab && (
                                <div>
                                    <div className="flex justify-between items-center mb-6 border-b pb-4">
                                        <h2 className="text-2xl font-['Bowlby_One_SC'] text-indigo-900 uppercase">
                                            {activeTab} <span className="text-sm bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-sans ml-2">{displayedData.length}</span>
                                        </h2>
                                        <button onClick={() => { setIsDownloading(true); setPosterData({ className: activeTab, items: displayedData, isJamiaView, isClassView, isRegionView, adminSettings }); }} disabled={isDownloading || displayedData.length === 0} className="px-4 py-2 bg-indigo-600 text-white rounded-lg shadow font-bold text-sm">Download Poster</button>
                                    </div>

                                    <div className="hidden md:block">
                                        <div className={`grid grid-cols-12 px-4 py-3 border-b text-sm font-bold text-slate-500 bg-slate-50 rounded-t-xl uppercase`}>
                                            <div className="col-span-1">Rank</div>
                                            {!isRegionView && !isClassView && <div className="col-span-3">Ustaz Name</div>}
                                            {!isRegionView && !isClassView && <div className="col-span-3">Jamia Name</div>}
                                            {isClassView && <div className="col-span-6">Class Name</div>}
                                            {isRegionView && <div className="col-span-6">Region Name</div>}
                                            {isJamiaView && <div className="col-span-6">Jamia Name</div>}
                                            {!isClassView && <div className="col-span-2 text-center">Region</div>}
                                            {showAmount && <div className="col-span-2 text-right text-emerald-600">Total Amount</div>}
                                            <div className={`${showAmount ? 'col-span-1' : 'col-span-3'} text-right text-sky-500`}>Units</div>
                                        </div>
                                        <div className="space-y-2 mt-2">
                                            {displayedData.map((it, idx) => (
                                                <div key={idx} className="grid grid-cols-12 items-center gap-4 p-3 rounded-xl bg-white border border-slate-100 shadow-sm">
                                                    <div className="col-span-1 font-bold text-slate-400">#{idx + 1}</div>
                                                    
                                                    {isRegionView && <div className="col-span-6 font-bold text-indigo-600 uppercase">{it.region}</div>}
                                                    {isClassView && <div className="col-span-6 font-bold text-indigo-600 uppercase">{it.className}</div>}
                                                    {isJamiaView && <div className="col-span-6 font-bold text-indigo-600">{it.jamiaName}</div>}
                                                    
                                                    {!isRegionView && !isClassView && !isJamiaView && <div className="col-span-3 font-semibold uppercase">{it.ustazName}</div>}
                                                    {!isRegionView && !isClassView && !isJamiaView && <div className="col-span-3 font-bold text-indigo-600">{it.jamiaName}</div>}
                                                    
                                                    {!isClassView && <div className="col-span-2 text-center text-sm font-bold">{it.region || "-"}</div>}
                                                    
                                                    {showAmount && <div className="col-span-2 text-right font-['Bowlby_One_SC'] text-emerald-600">₹{it.amount.toLocaleString('en-IN')}</div>}
                                                    <div className={`${showAmount ? 'col-span-1' : 'col-span-3'} text-right font-bold text-sky-600`}>{it.units}</div>
                                                </div>
                                            ))}
                                            {displayedData.length === 0 && !isLoading && <div className="p-8 text-center text-slate-500 font-bold">No Data Found for {adminSettings.targetColumn}</div>}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TelethoneDashboard />);
    </script>
</body>
</html>
