<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4F46E5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Zimmedar Panel - Telethon 2026</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234F46E5'/%3E%3Ctext x='50' y='68' font-size='56' fill='white' text-anchor='middle' font-family='Arial' font-weight='700'%3EZ%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Roboto', sans-serif; background-color: #F2F3F8; overscroll-behavior-y: contain; }
        .font-display { font-family: 'Poppins', sans-serif; }
        .hidden { display: none !important; }
        /* Hide number input arrows */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        :focus-visible { outline: 2px solid #4F46E5; outline-offset: 2px; }

        /* Material-style ripple, adapts to each button's text color */
        .ripple-container { position: relative; overflow: hidden; }
        .ripple-effect {
            position: absolute; border-radius: 50%;
            background-color: currentColor; opacity: .3;
            transform: scale(0);
            animation: rippleAnim .55s ease-out forwards;
            pointer-events: none;
        }
        @keyframes rippleAnim { to { transform: scale(2.6); opacity: 0; } }

        /* Card entrance */
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(10px) scale(.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-cardIn { animation: cardIn .45s cubic-bezier(.16,1,.3,1) both; }

        /* Bottom sheet entrance (referenced by original inline class) */
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Skeleton shimmer */
        @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
        .skeleton {
            background: linear-gradient(90deg, #E7E9F2 25%, #F3F4F9 37%, #E7E9F2 63%);
            background-size: 800px 100%;
            animation: shimmer 1.6s linear infinite;
        }

        #historyContent::-webkit-scrollbar { width: 5px; }
        #historyContent::-webkit-scrollbar-thumb { background: #C7CBE0; border-radius: 10px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .001ms !important;
            }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 antialiased">

    <!-- ========================================== -->
    <!-- 1. LOGIN SECTION -->
    <!-- ========================================== -->
    <div id="loginSection" class="relative min-h-screen flex items-center justify-center px-5 py-10 overflow-hidden">
        <div class="pointer-events-none absolute -top-24 -left-20 w-72 h-72 bg-indigo-300/40 rounded-full blur-3xl"></div>
        <div class="pointer-events-none absolute -bottom-28 -right-16 w-72 h-72 bg-violet-300/40 rounded-full blur-3xl"></div>

        <div class="relative w-full max-w-sm">
            <div class="bg-white/95 backdrop-blur-xl p-7 sm:p-8 rounded-[28px] shadow-xl shadow-indigo-100 border border-white">
                <div class="flex flex-col items-center text-center mb-7">
                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-600 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-200 mb-4">
                        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.031 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                    </div>
                    <h1 class="font-display text-2xl font-extrabold text-slate-900 leading-tight">Zimmedar Panel</h1>
                    <span class="mt-1.5 inline-flex items-center text-[11px] font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full tracking-wide">TELETHON 2026</span>
                </div>

                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-0.5">Username</label>
                        <div class="relative">
                            <svg class="w-[18px] h-[18px] absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                            <input type="text" id="loginUsername" required placeholder="Jaise: zaid_ula" class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 bg-slate-50 outline-none transition font-semibold text-slate-700 text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-0.5">Password</label>
                        <div class="relative">
                            <svg class="w-[18px] h-[18px] absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                            <input type="password" id="loginPassword" required placeholder="••••••" class="w-full pl-10 pr-11 py-3 border border-slate-200 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 bg-slate-50 outline-none transition font-semibold text-slate-700 text-sm">
                            <button type="button" id="togglePasswordBtn" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-600 transition p-1" aria-label="Password dikhayein ya chupayein">
                                <svg id="eyeOpenIcon" class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                <svg id="eyeClosedIcon" class="hidden w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.025 10.025 0 012.442-3.442m3.256-2.492A9.956 9.956 0 0112 5c4.478 0 8.268 2.943 9.542 7a9.972 9.972 0 01-4.043 5.197M3 3l18 18"/></svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" id="loginBtn" class="ripple-container w-full bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-200/70 active:scale-[0.98] transition mt-2 flex items-center justify-center gap-2 text-[15px]">
                        <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 12h15"/></svg>
                        Login Karein
                    </button>
                </form>
            </div>
            <p class="text-center text-[11px] text-slate-400 font-medium mt-5">Sirf authorized Zimmedar hi is panel mein login kar sakte hain</p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 2. MAIN DASHBOARD SECTION -->
    <!-- ========================================== -->
    <div id="dashboardSection" class="hidden min-h-screen flex flex-col">

        <!-- App Bar -->
        <header id="appBar" class="sticky top-0 z-30 bg-gradient-to-r from-indigo-600 to-violet-600 transition-shadow duration-300" style="padding-top:env(safe-area-inset-top,0px)">
            <div class="max-w-xl mx-auto w-full px-4 sm:px-6 py-3.5 flex items-center gap-3">
                <div id="avatarInitials" class="w-11 h-11 rounded-full bg-white/15 border border-white/25 flex items-center justify-center text-white font-display font-bold text-[13px] shrink-0">--</div>
                <div class="flex-1 min-w-0">
                    <h1 class="font-display font-bold leading-tight truncate text-[15px] sm:text-base" id="displayZimmedarName">Name</h1>
                    <p class="text-indigo-100 text-[11px] font-semibold mt-0.5 flex items-center gap-1">
                        Class: <span id="displayClass" class="text-white font-bold px-1.5 py-0.5 bg-white/15 rounded-md ml-0.5">Class</span>
                    </p>
                </div>
                <button id="logoutBtn" class="ripple-container w-10 h-10 rounded-full bg-white/10 hover:bg-rose-500 text-white flex items-center justify-center transition active:scale-90 shrink-0" title="Logout">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </header>

        <main class="flex-1 w-full max-w-xl mx-auto px-3.5 sm:px-5 pt-4" style="padding-bottom:calc(2.5rem + env(safe-area-inset-bottom,0px))">

            <!-- Stats Strip -->
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div class="bg-white rounded-2xl border border-slate-100 shadow-sm px-4 py-3">
                    <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Total Ustaz</p>
                    <p id="statTeacherCount" class="font-display text-xl font-extrabold text-indigo-700 mt-0.5">0</p>
                </div>
                <div class="bg-white rounded-2xl border border-slate-100 shadow-sm px-4 py-3">
                    <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Total Collected</p>
                    <p id="statTotalAmount" class="font-display text-xl font-extrabold text-emerald-600 mt-0.5 tabular-nums">₹0</p>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="mb-4">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Jamia ya Ustaz search karein..." class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition text-sm font-semibold text-slate-700 shadow-sm bg-white">
                    <svg class="w-4 h-4 absolute left-4 top-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>

            <!-- Asatiza List -->
            <div id="jamiaList" class="space-y-3.5 pb-2">
                <div class="bg-white rounded-[22px] border border-slate-100 shadow-sm p-4 sm:p-5">
                    <div class="flex items-center gap-3">
                        <div class="w-14 h-14 rounded-full skeleton shrink-0"></div>
                        <div class="flex-1 space-y-2">
                            <div class="h-3.5 w-2/3 rounded skeleton"></div>
                            <div class="h-3 w-1/2 rounded skeleton"></div>
                        </div>
                    </div>
                    <div class="h-16 rounded-2xl skeleton mt-4"></div>
                    <div class="h-10 rounded-xl skeleton mt-4"></div>
                </div>
                <div class="bg-white rounded-[22px] border border-slate-100 shadow-sm p-4 sm:p-5">
                    <div class="flex items-center gap-3">
                        <div class="w-14 h-14 rounded-full skeleton shrink-0"></div>
                        <div class="flex-1 space-y-2">
                            <div class="h-3.5 w-2/3 rounded skeleton"></div>
                            <div class="h-3 w-1/2 rounded skeleton"></div>
                        </div>
                    </div>
                    <div class="h-16 rounded-2xl skeleton mt-4"></div>
                    <div class="h-10 rounded-xl skeleton mt-4"></div>
                </div>
                <div class="bg-white rounded-[22px] border border-slate-100 shadow-sm p-4 sm:p-5">
                    <div class="flex items-center gap-3">
                        <div class="w-14 h-14 rounded-full skeleton shrink-0"></div>
                        <div class="flex-1 space-y-2">
                            <div class="h-3.5 w-2/3 rounded skeleton"></div>
                            <div class="h-3 w-1/2 rounded skeleton"></div>
                        </div>
                    </div>
                    <div class="h-16 rounded-2xl skeleton mt-4"></div>
                    <div class="h-10 rounded-xl skeleton mt-4"></div>
                </div>
            </div>

            <!-- No search results state -->
            <div id="noResultsState" class="hidden text-center py-14">
                <div class="w-14 h-14 rounded-full bg-slate-100 flex items-center justify-center mx-auto mb-3">
                    <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
                <p class="text-slate-500 font-semibold text-sm">Koi match nahi mila</p>
                <p class="text-slate-400 text-xs mt-1">Dusra naam try karein</p>
            </div>

        </main>
    </div>

    <!-- ========================================== -->
    <!-- 3. DAILY RECORDS (HISTORY) MODAL -->
    <!-- ========================================== -->
    <div id="historyModal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center">
        <div id="historyBackdrop" onclick="closeHistory()" class="absolute inset-0 bg-slate-900/55 backdrop-blur-sm"></div>
        <div class="relative bg-white w-full sm:max-w-md rounded-t-[28px] sm:rounded-3xl max-h-[88vh] sm:max-h-[85vh] flex flex-col shadow-2xl overflow-hidden animate-[fade-up_0.35s_cubic-bezier(0.16,1,0.3,1)]" style="padding-bottom:env(safe-area-inset-bottom,0px)">
            <div class="pt-2.5 pb-1 flex justify-center sm:hidden shrink-0">
                <div class="w-10 h-1.5 rounded-full bg-slate-200"></div>
            </div>
            <div class="bg-gradient-to-r from-indigo-600 to-violet-600 px-5 py-4 flex justify-between items-center text-white shrink-0">
                <h2 id="modalTitle" class="font-bold text-base sm:text-lg font-display flex items-center gap-2 truncate pr-2">
                    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    History
                </h2>
                <button onclick="closeHistory()" class="ripple-container w-8 h-8 rounded-full bg-white/15 hover:bg-white/25 flex items-center justify-center text-xl font-bold leading-none transition active:scale-90 flex-shrink-0">&times;</button>
            </div>
            <div id="historyContent" class="p-4 overflow-y-auto flex-1 bg-slate-50 space-y-4">
                <!-- Records will load here -->
            </div>
        </div>
    </div>

    <script>
        // ========================================================
        // 🛑 APNA FIREBASE CONFIG YAHAN PASTE KAREIN 🛑
        // ========================================================
        const firebaseConfig = {
            apiKey: "AIzaSyC87_ca7MsGB2WjOnr6dC-IYL78TYx0Oyg",
            authDomain: "telethon-28c88.firebaseapp.com",
            projectId: "telethon-28c88",
            storageBucket: "telethon-28c88.firebasestorage.app",
            messagingSenderId: "609452116316",
            appId: "1:609452116316:web:e940fc5dc4537b34551999",
            measurementId: "G-FYS0PJLQQB"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentZimmedar = null;

        // --- NEW GOOGLE DRIVE PHOTO FIX (100% WORKING) ---
        function getDirectImageUrl(url) {
            if (!url) return "";
            const match = url.match(/[-\w]{25,}/); // 33 char id nikalna
            if (match && match[0]) {
                return `https://lh3.googleusercontent.com/d/${match[0]}`;
            }
            return url;
        }

        // --- UI HELPERS (design only, no business logic) ---
        function getInitials(name) {
            if (!name) return "?";
            const parts = name.trim().split(/\s+/);
            return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
        }
        function vibrate(ms) {
            try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch (e) {}
        }

        // Material-style ripple for any element with .ripple-container, works for
        // elements added later too (dynamic teacher cards) via event delegation.
        document.addEventListener('click', function (e) {
            const el = e.target.closest('.ripple-container');
            if (!el) return;
            const rect = el.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height) * 1.4;
            const ripple = document.createElement('span');
            ripple.className = 'ripple-effect';
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            el.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });

        // App bar elevation on scroll
        window.addEventListener('scroll', () => {
            const bar = document.getElementById('appBar');
            if (!bar) return;
            if (window.scrollY > 4) bar.classList.add('shadow-lg');
            else bar.classList.remove('shadow-lg');
        });

        // Show/hide password
        document.getElementById('togglePasswordBtn').addEventListener('click', () => {
            const pwd = document.getElementById('loginPassword');
            const show = pwd.type === 'password';
            pwd.type = show ? 'text' : 'password';
            document.getElementById('eyeOpenIcon').classList.toggle('hidden', show);
            document.getElementById('eyeClosedIcon').classList.toggle('hidden', !show);
        });

        // ========================================================
        // 1. LOGIN LOGIC
        // ========================================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> Logging in...';
            btn.disabled = true;

            const username = document.getElementById('loginUsername').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;
            const fakeEmail = username + "@telethon.com";

            try {
                await auth.signInWithEmailAndPassword(fakeEmail, password);
            } catch (error) {
                alert("❌ Login Fail: Username ya Password galat hai.");
                btn.innerHTML = '<svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 12h15"/></svg> Login Karein';
                btn.disabled = false;
            }
        });

        // ========================================================
        // 2. AUTH STATE & LOAD DATA
        // ========================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const doc = await db.collection('users').doc(user.uid).get();
                if (doc.exists) {
                    currentZimmedar = doc.data();

                    document.getElementById('displayZimmedarName').innerText = currentZimmedar.ustazName + " (Zimmedar)";
                    document.getElementById('displayClass').innerText = currentZimmedar.assignedClass;
                    document.getElementById('avatarInitials').innerText = getInitials(currentZimmedar.ustazName);

                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboardSection').classList.remove('hidden');

                    loadJamias(currentZimmedar.assignedClass);
                } else {
                    auth.signOut();
                }
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('dashboardSection').classList.add('hidden');
                document.getElementById('loginBtn').innerHTML = '<svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 12h15"/></svg> Login Karein';
                document.getElementById('loginBtn').disabled = false;
            }
        });

        // ========================================================
        // 3. LOAD JAMIAS / TEACHERS (Mobile Optimized Design)
        // ========================================================
      function loadJamias(assignedClass) {
            // Main class ke sath uske A, B, C, D sections array me add karein
            let classVariants = [
                assignedClass,
                assignedClass + " A",
                assignedClass + " B",
                assignedClass + " C",
                assignedClass + " D"
            ];

            // NAYA CODE: Sale Duwam aur Sale Duwam Khususi ko merge karne ke liye
            if (assignedClass === "Sale Duwam" || assignedClass === "Sale Duwam Khususi") {
                classVariants = [
                    "Sale Duwam", "Sale Duwam A", "Sale Duwam B", "Sale Duwam C", "Sale Duwam D",
                    "Sale Duwam Khususi", "Sale Duwam Khususi A", "Sale Duwam Khususi B", "Sale Duwam Khususi C", "Sale Duwam Khususi D"
                ];
            }

            // in operator use kiya gaya hai taki sab variants aur khususi ek sath fetch ho jayein
            db.collection('asatiza_details').where("className", "in", classVariants).onSnapshot((snapshot) => {
                const listDiv = document.getElementById('jamiaList');
                listDiv.innerHTML = "";

                if (snapshot.empty) {
                    document.getElementById('statTeacherCount').innerText = "0";
                    document.getElementById('statTotalAmount').innerText = "₹0";
                    listDiv.innerHTML = `
                        <div class="text-center p-10 bg-white rounded-2xl shadow-sm border border-slate-200">
                            <div class="w-14 h-14 rounded-full bg-slate-100 flex items-center justify-center mx-auto mb-3">
                                <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 13V7a2 2 0 00-2-2H6a2 2 0 00-2 2v6m16 0l-2 5H6l-2-5m16 0H4"/></svg>
                            </div>
                            <p class="text-slate-500 text-sm font-semibold">Is class mein abhi tak kisi Ustad ki entry nahi hai.</p>
                        </div>`;
                    return;
                }

                let records = [];
                snapshot.forEach(doc => { records.push({ id: doc.id, ...doc.data() }); });

                // Ustaz ke naam se A-Z sort karna
                records.sort((a, b) => (a.ustazName || "").localeCompare(b.ustazName || ""));

                // Quick overview stats (derived only, no extra Firestore reads)
                const totalCollected = records.reduce((sum, r) => sum + (parseFloat(r.daily_amount) || 0), 0);
                document.getElementById('statTeacherCount').innerText = records.length;
                document.getElementById('statTotalAmount').innerText = "₹" + totalCollected.toLocaleString('en-IN');

                records.forEach((data, idx) => {
                    const docId = data.id;
                    const totalSoFar = parseFloat(data.daily_amount) || 0;
                    const totalUnit = (totalSoFar / 7000).toFixed(1);
                    const progressPct = Math.min(100, ((totalSoFar % 7000) / 7000) * 100).toFixed(1);

                    const photoSrc = getDirectImageUrl(data.photoUrl);
                    const initials = getInitials(data.ustazName);
                    const avatarFallback = `<div class="absolute inset-0 rounded-full bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white font-bold font-display text-sm ring-2 ring-white shadow-sm">${initials}</div>`;
                    const photoHtml = photoSrc
                        ? `<div class="relative w-14 h-14 shrink-0">${avatarFallback}<img src="${photoSrc}" referrerpolicy="no-referrer" loading="lazy" alt="${data.ustazName}" class="relative w-14 h-14 rounded-full object-cover ring-2 ring-white shadow-sm" onerror="this.style.display='none'"></div>`
                        : `<div class="relative w-14 h-14 shrink-0">${avatarFallback}</div>`;

                    const card = document.createElement('div');
                    card.className = "jamia-card bg-white rounded-[22px] shadow-sm border border-slate-100 overflow-hidden animate-cardIn";
                    card.style.animationDelay = (idx * 45) + "ms";
                    card.setAttribute('data-search', `${(data.jamiaName||'').toLowerCase()} ${(data.ustazName||'').toLowerCase()}`);

                    // Clean & Compact Design HTML
                    card.innerHTML = `
                        <div class="p-4 sm:p-5 flex flex-col gap-4">
                            <!-- Names & Photo Row -->
                            <div class="flex items-center gap-3.5">
                                ${photoHtml}
                                <div class="flex-1 leading-tight min-w-0">
                                    <h2 class="text-[15px] sm:text-base font-display font-bold text-indigo-700 uppercase tracking-wide truncate">${data.ustazName}</h2>
                                    <div class="text-[14px] font-bold text-slate-700 mt-1 truncate">${data.jamiaName}</div>
                                    <div class="text-[11px] font-semibold text-slate-400 mt-1 flex items-center gap-1">
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.949.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                                        ${data.mobileNo || '-'}
                                    </div>
                                </div>
                            </div>

                            <!-- Total Display Box -->
                            <div class="rounded-2xl bg-gradient-to-br from-indigo-50 to-white border border-indigo-100/70 px-4 py-3.5">
                                <div class="flex items-end justify-between gap-2">
                                    <div>
                                       <div class="text-[10px] uppercase font-bold text-indigo-400 tracking-wider">Aaj Ki Jama Raqam (Daily)</div>
                                        <div class="text-[26px] sm:text-3xl font-display font-extrabold text-emerald-600 mt-0.5 leading-none tabular-nums">₹${totalSoFar.toLocaleString('en-IN')}</div>
                                    </div>
                                    <span class="text-[11px] font-bold text-sky-600 bg-white px-2 py-1 rounded-lg border border-sky-100 shrink-0 whitespace-nowrap">${totalUnit} Units</span>
                                </div>
                                <div class="mt-2.5 h-1.5 w-full rounded-full bg-white/80 overflow-hidden">
                                    <div class="h-full rounded-full bg-gradient-to-r from-indigo-400 to-emerald-500" style="width:${progressPct}%"></div>
                                </div>
                            </div>

                            <!-- Action Inputs -->
                            <div class="flex gap-2">
                                <div class="relative flex-1">
                                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-sm pointer-events-none">₹</span>
                                    <input type="number" inputmode="decimal" id="amt_${docId}" placeholder="Amount" class="w-full pl-7 pr-3 py-2.5 border border-slate-200 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none font-bold text-slate-700 text-sm bg-slate-50 transition">
                                </div>
                                <button onclick="submitEntry('add', '${docId}', '${data.jamiaName}', '${data.ustazName}')" class="ripple-container shrink-0 bg-gradient-to-br from-indigo-600 to-violet-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md shadow-indigo-200 active:scale-95 transition flex items-center gap-1.5">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                                    Add
                                </button>
                            </div>

                            <!-- Extra Options (History, Set Total, Minus) -->
                            <div class="flex justify-between items-center pt-3 border-t border-slate-100">
                                <button onclick="openTeacherHistory('${docId}', '${data.ustazName}')" class="ripple-container text-[11px] font-bold text-emerald-600 flex items-center gap-1 bg-emerald-50 px-2.5 py-1.5 rounded-lg border border-emerald-100 active:scale-95 transition">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    History
                                </button>

                                <div class="flex items-center gap-1.5">
                                    <button onclick="submitEntry('set', '${docId}', '${data.jamiaName}', '${data.ustazName}')" class="ripple-container text-[11px] font-bold text-sky-600 flex items-center gap-1 bg-sky-50 px-2.5 py-1.5 rounded-lg border border-sky-100 active:scale-95 transition">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                        Set
                                    </button>
                                    <button onclick="submitEntry('minus', '${docId}', '${data.jamiaName}', '${data.ustazName}')" class="ripple-container text-[11px] font-bold text-rose-600 flex items-center gap-1 bg-rose-50 px-2.5 py-1.5 rounded-lg border border-rose-100 active:scale-95 transition">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"></path></svg>
                                        Minus
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    listDiv.appendChild(card);
                });
            });
        }

        // Live Search Filter
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.jamia-card');
            let anyVisible = false;
            cards.forEach(card => {
                if (card.getAttribute('data-search').includes(searchTerm)) { card.classList.remove('hidden'); anyVisible = true; }
                else card.classList.add('hidden');
            });
            document.getElementById('noResultsState').classList.toggle('hidden', anyVisible || cards.length === 0);
        });

        // ========================================================
        // 4. SUBMIT AMOUNT (Auto-Plus, Set Total, Minus)
        // ========================================================
        window.submitEntry = async function(action, docId, jamiaName, ustazName) {
            vibrate(10);
            const inputField = document.getElementById(`amt_${docId}`);
            let amountVal = parseFloat(inputField.value);

            if (!amountVal || amountVal <= 0) {
                alert("Barae Karam box mein sahi amount darj karein!");
                return;
            }

            let confirmMsg = "";
            let updatePayload = {};

           if (action === 'add') {
                confirmMsg = `Kya aap ${ustazName} (${jamiaName}) ke account mein ₹${amountVal} PLUS (+) karna chahte hain?`;
                updatePayload = { 
                    amount: firebase.firestore.FieldValue.increment(amountVal),
                    daily_amount: firebase.firestore.FieldValue.increment(amountVal)
                };
            } else if (action === 'set') {
                confirmMsg = `Kya aap ${ustazName} ka TOTAL amount ₹${amountVal} fix karna chahte hain?\n(Purana amount overwrite ho jayega)`;
                updatePayload = { 
                    amount: amountVal,
                    daily_amount: amountVal
                };
            } else if (action === 'minus') {
                confirmMsg = `⚠️ ALERT ⚠️\nKya aap waqai ${ustazName} ke account se ₹${amountVal} MINUS (-) karna chahte hain?`;
                updatePayload = { 
                    amount: firebase.firestore.FieldValue.increment(-amountVal),
                    daily_amount: firebase.firestore.FieldValue.increment(-amountVal)
                };
            }

            if (!confirm(confirmMsg)) return;

            try {
                // Update Main Record
                await db.collection('asatiza_details').doc(docId).update(updatePayload);

                // Save to Daily History
                await db.collection('entries_history').add({
                    asatizaId: docId, // Ye ID zaroori hai filtering ke liye
                    jamiaName: jamiaName,
                    ustazName: ustazName,
                    actionType: action,
                    amountVal: amountVal,
                    zimmedarUid: auth.currentUser.uid,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById(`amt_${docId}`).value = "";

            } catch (error) {
                console.error("Entry fail:", error);
                alert("Entry save nahi hui, Barae Karam internet check karein.");
            }
        };

        // ========================================================
        // 5. TEACHER SPECIFIC HISTORY
        // ========================================================
        // UPDATE: Naya function jo sirf click kiye gaye teacher ki history layega
        async function openTeacherHistory(docId, ustazName) {
            vibrate(8);
            document.getElementById('historyModal').classList.remove('hidden');

            // Modal ka naam change karna
            document.getElementById('modalTitle').innerHTML = `
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                History: ${ustazName}
            `;

            const content = document.getElementById('historyContent');
            content.innerHTML = `
                <div class="space-y-3">
                    <div class="h-20 rounded-2xl skeleton"></div>
                    <div class="h-20 rounded-2xl skeleton"></div>
                    <div class="h-20 rounded-2xl skeleton"></div>
                </div>`;

            try {
                const snapshot = await db.collection('entries_history')
                    .where('zimmedarUid', '==', auth.currentUser.uid)
                    .where('asatizaId', '==', docId) // SIRF ISI USTAD KA DATA FILTER HOGA
                    .get();

                let records = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if(data.timestamp) records.push(data);
                });

                records.sort((a,b) => b.timestamp.toDate() - a.timestamp.toDate());

                let groupedByDate = {};
                records.forEach(r => {
                    const dateObj = r.timestamp.toDate();
                    const dateStr = dateObj.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});

                    if(!groupedByDate[dateStr]) groupedByDate[dateStr] = { dailyTotal: 0, items: [] };

                    groupedByDate[dateStr].items.push(r);

                    if(r.actionType === 'add') {
                        groupedByDate[dateStr].dailyTotal += r.amountVal;
                    } else if (r.actionType === 'minus') {
                        groupedByDate[dateStr].dailyTotal -= r.amountVal;
                    }
                });

                if(Object.keys(groupedByDate).length === 0) {
                    content.innerHTML = `
                        <div class="text-center py-14">
                            <div class="w-14 h-14 rounded-full bg-slate-100 flex items-center justify-center mx-auto mb-3">
                                <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                            </div>
                            <p class="text-slate-500 text-sm font-semibold">Inki abhi tak koi history nahi hai.</p>
                        </div>`;
                    return;
                }

                let html = "";
                for(let date in groupedByDate) {
                    html += `
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="bg-indigo-50/70 px-4 py-3 border-b border-indigo-100 flex justify-between items-center">
                                <span class="font-bold text-indigo-800 text-sm font-display">${date}</span>
                                <div class="text-right">
                                    <span class="block text-[9px] uppercase font-bold text-indigo-400 leading-tight">Daily Added</span>
                                    <span class="font-bold text-emerald-600 text-sm font-display tabular-nums">₹${groupedByDate[date].dailyTotal.toLocaleString('en-IN')}</span>
                                </div>
                            </div>
                            <div class="p-2 space-y-1">
                    `;

                    groupedByDate[date].items.forEach(item => {
                        const timeStr = item.timestamp.toDate().toLocaleTimeString('en-IN', {hour: '2-digit', minute:'2-digit'});
                        let actionText = "";
                        let iconBg = "";
                        let iconPath = "";
                        let textColor = "";
                        const amt = item.amountVal || 0;

                        if(item.actionType === 'add') {
                            actionText = `+₹${amt}`; iconBg = "bg-emerald-100 text-emerald-600"; textColor = "text-emerald-600";
                            iconPath = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>';
                        } else if(item.actionType === 'set') {
                            actionText = `Set ₹${amt}`; iconBg = "bg-sky-100 text-sky-600"; textColor = "text-sky-600";
                            iconPath = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>';
                        } else if(item.actionType === 'minus') {
                            actionText = `-₹${amt}`; iconBg = "bg-rose-100 text-rose-600"; textColor = "text-rose-600";
                            iconPath = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"/>';
                        }

                        html += `
                            <div class="flex items-center gap-3 text-xs p-2.5 hover:bg-slate-50 rounded-xl transition">
                                <div class="w-8 h-8 rounded-full ${iconBg} flex items-center justify-center shrink-0">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">${iconPath}</svg>
                                </div>
                                <div class="leading-tight flex-1 min-w-0">
                                    <div class="font-bold text-slate-800 text-[13px] truncate">${item.ustazName}</div>
                                    <div class="text-slate-400 font-semibold mt-0.5">${timeStr} &bull; ${item.jamiaName}</div>
                                </div>
                                <div class="font-bold ${textColor} shrink-0 tabular-nums">${actionText}</div>
                            </div>
                        `;
                    });

                    html += `</div></div>`;
                }
                content.innerHTML = html;

            } catch(err) {
                content.innerHTML = `<div class="text-rose-500 text-center py-4 text-sm font-bold">Error: ${err.message}</div>`;
            }
        }

        function closeHistory() {
            document.getElementById('historyModal').classList.add('hidden');
        }

        // ========================================================
        // 6. LOGOUT
        // ========================================================
        document.getElementById('logoutBtn').addEventListener('click', () => {
            vibrate(10);
            auth.signOut();
        });
    </script>
</body>
</html>
