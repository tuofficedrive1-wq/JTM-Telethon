<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zimmedar Panel - Telethon 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="p-4 sm:p-6 min-h-screen">

    <div class="max-w-4xl mx-auto">
        
        <!-- ========================================== -->
        <!-- 1. LOGIN SECTION -->
        <!-- ========================================== -->
        <div id="loginSection" class="bg-white p-8 rounded-3xl shadow-xl border border-slate-200 mt-10 max-w-md mx-auto">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-indigo-600 mb-2">Zimmedar Login</h1>
                <p class="text-slate-500 text-sm">Apni class ke teachers ka collection manage karein</p>
            </div>
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                    <input type="text" id="loginUsername" required placeholder="Jaise: zaid_ula" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 bg-slate-50 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 bg-slate-50 outline-none transition">
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition shadow-lg mt-4">
                    Login Karein
                </button>
            </form>
        </div>

        <!-- ========================================== -->
        <!-- 2. MAIN DASHBOARD SECTION -->
        <!-- ========================================== -->
        <div id="dashboardSection" class="hidden">
            
            <!-- Header -->
            <header class="bg-indigo-600 text-white p-5 rounded-2xl shadow-lg flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <div>
                    <h1 class="text-2xl font-bold" id="displayZimmedarName">Zimmedar Name</h1>
                    <p class="text-indigo-200 font-semibold text-sm mt-1 flex items-center gap-2">
                        Assigned Class: <span id="displayClass" class="text-white font-bold px-3 py-1 bg-indigo-800 rounded-lg tracking-wide">Class</span>
                    </p>
                </div>
                <button id="logoutBtn" class="bg-indigo-800 text-white px-5 py-2.5 rounded-xl text-sm font-bold hover:bg-rose-500 transition shadow-md">Logout</button>
            </header>

            <!-- Search Bar -->
            <div class="mb-6 relative">
                <input type="text" id="searchInput" placeholder="Jamia ya Ustaz ka naam search karein..." class="w-full pl-5 pr-5 py-4 border-2 border-slate-200 rounded-2xl focus:border-indigo-500 focus:ring-0 outline-none transition text-lg font-semibold text-slate-700 shadow-sm">
            </div>

            <!-- Jamias / Asatiza List -->
            <div id="jamiaList" class="space-y-4">
                <div class="text-center p-10 text-slate-500 font-semibold animate-pulse">Data load ho raha hai...</div>
            </div>
            
        </div>
    </div>

    <script>
        // ========================================================
        // 🛑 APNA FIREBASE CONFIG YAHAN PASTE KAREIN 🛑
        // ========================================================
        const firebaseConfig = {
            apiKey: "AIzaSyC87_ca7MsGB2WjOnr6dC-IYL78TYx0Oyg",
            authDomain: "telethon-28c88.firebaseapp.com",
            projectId: "telethon-28c88",
            storageBucket: "telethon-28c88.firebasestorage.app",
            messagingSenderId: "609452116316",
            appId: "1:609452116316:web:e940fc5dc4537b34551999",
            measurementId: "G-FYS0PJLQQB"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentZimmedar = null;

        // ========================================================
        // 1. LOGIN LOGIC
        // ========================================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = "Logging in..."; btn.disabled = true;

            const username = document.getElementById('loginUsername').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;
            const fakeEmail = username + "@telethon.com";

            try {
                await auth.signInWithEmailAndPassword(fakeEmail, password);
            } catch (error) {
                alert("❌ Login Fail: Username ya Password galat hai.");
                btn.innerHTML = "Login Karein"; btn.disabled = false;
            }
        });

        // ========================================================
        // 2. CHECK LOGIN & LOAD ASSIGNED CLASS DATA
        // ========================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const doc = await db.collection('users').doc(user.uid).get();
                if (doc.exists) {
                    currentZimmedar = doc.data();
                    
                    document.getElementById('displayZimmedarName').innerText = currentZimmedar.ustazName + " (Zimmedar)";
                    document.getElementById('displayClass').innerText = currentZimmedar.assignedClass;

                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboardSection').classList.remove('hidden');

                    // Zimmedar ki Class wale asatiza ko load karein
                    loadJamias(currentZimmedar.assignedClass);
                } else {
                    auth.signOut();
                }
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('dashboardSection').classList.add('hidden');
                document.getElementById('loginBtn').innerHTML = "Login Karein";
                document.getElementById('loginBtn').disabled = false;
            }
        });

        // ========================================================
        // 3. LOAD JAMIAS / TEACHERS (From asatiza_details)
        // ========================================================
        function loadJamias(assignedClass) {
            // Asatiza ki collection se wahi data nikalenge jiski class zimmedar ki class ke barabar ho
            db.collection('asatiza_details').where("className", "==", assignedClass).onSnapshot((snapshot) => {
                const listDiv = document.getElementById('jamiaList');
                listDiv.innerHTML = "";

                if (snapshot.empty) {
                    listDiv.innerHTML = '<div class="text-center p-8 bg-white rounded-2xl shadow-sm border border-slate-200 text-slate-500 font-semibold">Aapki class mein abhi tak kisi Ustad ne form nahi bhara hai.</div>';
                    return;
                }

                // Data ko Jamia ke naam se A-Z sort karne ke liye Array mein daal rahe hain
                let records = [];
                snapshot.forEach(doc => {
                    records.push({ id: doc.id, ...doc.data() });
                });
                records.sort((a, b) => (a.jamiaName || "").localeCompare(b.jamiaName || ""));

                records.forEach((data) => {
                    const docId = data.id;
                    const totalSoFar = parseFloat(data.amount) || 0;
                    const totalUnit = (totalSoFar / 7000).toFixed(1);

                    const card = document.createElement('div');
                    card.className = "jamia-card bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col lg:flex-row justify-between items-center gap-6 transition hover:shadow-md";
                    card.setAttribute('data-search', `${(data.jamiaName||'').toLowerCase()} ${(data.ustazName||'').toLowerCase()} ${(data.region||'').toLowerCase()}`);

                    card.innerHTML = `
                        <div class="w-full lg:w-3/5">
                            <h3 class="text-xl font-bold text-indigo-700">${data.jamiaName}</h3>
                            <div class="text-sm text-slate-500 mt-2 grid grid-cols-2 gap-2">
                                <div><span class="font-bold text-slate-700">Ustaz:</span> ${data.ustazName}</div>
                                <div><span class="font-bold text-slate-700">Region:</span> ${data.region}</div>
                                <div><span class="font-bold text-slate-700">Section:</span> ${data.section || '-'}</div>
                                <div><span class="font-bold text-slate-700">Mobile:</span> ${data.mobileNo || '-'}</div>
                            </div>
                        </div>

                        <!-- Amount Display Area -->
                        <div class="w-full lg:w-auto flex flex-col sm:flex-row gap-4 items-center bg-slate-50 p-4 rounded-xl border border-slate-100">
                            <div class="text-center px-4">
                                <div class="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1">Total Jama Raqam</div>
                                <div class="text-xl font-bold text-emerald-600">₹ ${totalSoFar.toLocaleString('en-IN')}</div>
                                <div class="text-xs font-bold text-sky-600 mt-1">${totalUnit} Units</div>
                            </div>
                            
                            <div class="w-px h-12 bg-slate-200 hidden sm:block"></div>
                            
                            <div class="flex flex-col gap-2 w-full sm:w-auto">
                                <div class="flex gap-2">
                                    <input type="number" id="amt_${docId}" placeholder="Nayi Raqam (₹)" class="w-full sm:w-32 px-3 py-2 border-2 border-slate-200 rounded-lg focus:border-indigo-500 outline-none font-bold text-slate-700 text-sm">
                                    <button onclick="submitEntry('${docId}', '${data.jamiaName}')" id="btn_${docId}" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-indigo-700 transition shrink-0 shadow-sm active:scale-95">
                                        Add
                                    </button>
                                </div>
                                <p class="text-[10px] text-slate-400 font-semibold text-center leading-tight">Yahan amount dalne se pichli<br>raqam me auto plus (jod) jayega.</p>
                            </div>
                        </div>
                    `;
                    listDiv.appendChild(card);
                });
            });
        }

        // Live Search Filter
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.jamia-card');
            
            cards.forEach(card => {
                const text = card.getAttribute('data-search');
                if (text.includes(searchTerm)) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        });

        // ========================================================
        // 4. SUBMIT AMOUNT (Auto-Plus / Increment Logic)
        // ========================================================
        window.submitEntry = async function(docId, jamiaName) {
            const inputField = document.getElementById(`amt_${docId}`);
            const btn = document.getElementById(`btn_${docId}`);
            const amountToAdd = parseFloat(inputField.value);

            if (!amountToAdd || amountToAdd <= 0) {
                alert("Kripya sahi raqam (amount) darj karein!");
                return;
            }

            if (!confirm(`${jamiaName} ke purane amount mein ₹${amountToAdd} jama (add) kar dein?`)) return;

            btn.innerText = "...";
            btn.disabled = true;

            try {
                // 1. Database me Total Amount ko Plus (Increment) karna
                // firebase.firestore.FieldValue.increment automatically purane amount me naya jod deta hai
                await db.collection('asatiza_details').doc(docId).update({
                    amount: firebase.firestore.FieldValue.increment(amountToAdd)
                });

                // 2. History record save karna (Takein pata rahe kab kitne paise dale gaye)
                await db.collection('entries_history').add({
                    asatizaId: docId,
                    jamiaName: jamiaName,
                    amountAdded: amountToAdd,
                    zimmedarUid: auth.currentUser.uid,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                inputField.value = ""; // Input khali karo
                
            } catch (error) {
                console.error("Entry fail:", error);
                alert("Entry save nahi hui, kripya internet check karein.");
            } finally {
                btn.innerText = "Add";
                btn.disabled = false;
            }
        };

        // ========================================================
        // 5. LOGOUT
        // ========================================================
        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth.signOut();
        });
    </script>
</body>
</html>
