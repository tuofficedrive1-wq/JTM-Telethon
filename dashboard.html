        function TelethoneDashboard() {
            const defaultClassesList = ["Prep Class", "Hifz Class", "Ibtidaiya", "Sale Awwal", "Sale Duwam", "Ula", "Saniya", "Salisa", "Rabia", "Khamisa", "Sadisa", "Sabia", "Doratul Hadis"];
            const [availableClasses, setAvailableClasses] = useState([]);
            const [classHeadingsMap, setClassHeadingsMap] = useState({});
            const [activeTab, setActiveTab] = useState("All Jamiaat");
            
            const [allData, setAllData] = useState([]);
            const [customRecords, setCustomRecords] = useState([]);
            
            const [isLoading, setIsLoading] = useState(true);
            const [headerConfig, setHeaderConfig] = useState(null);
            const [timerConfig, setTimerConfig] = useState(null);
            const [competitions, setCompetitions] = useState([]);
            const [countdownStr, setCountdownStr] = useState("");
            const [showTop3, setShowTop3] = useState(false);
            const [posterData, setPosterData] = useState(null);
            const [isDownloading, setIsDownloading] = useState(false);
            const posterContainerRef = useRef(null);

            const getDirectImageUrl = (url) => {
                if (!url) return "";
                const match = url.match(/[-\w]{25,}/); 
                if (match && match[0]) return `https://lh3.googleusercontent.com/d/${match[0]}`;
                return url;
            };

            const getBaseClass = (className) => { 
                if (!className) return "N/A"; 
                let base = className.replace(/\s+[A-D]$/i, '').trim(); 
                if (base === "Sale Duwam Khususi") return "Sale Duwam"; 
                return base; 
            };

            useEffect(() => {
                posterContainerRef.current = document.getElementById('poster-container');
                
                const unsubSettings = db.collection('settings').doc('classes').onSnapshot(doc => {
                    if(doc.exists && doc.data().list) {
                        let dbList = doc.data().list;
                        dbList = dbList.filter(c => c !== "Sale Duwam Khususi");

                        if (!dbList.includes("Ula") && !dbList.includes("Saniya")) {
                            setAvailableClasses(Array.from(new Set([...defaultClassesList, ...dbList])));
                        } else {
                            setAvailableClasses(dbList);
                        }
                        setClassHeadingsMap(doc.data().headings || {});
                    } else {
                        setAvailableClasses([...defaultClassesList]);
                    }
                });

                const unsubAsatiza = db.collection('asatiza_details').onSnapshot(snapshot => {
                    const parsedData = snapshot.docs.map(doc => {
                        const data = doc.data(); 
                        return { id: doc.id, ustazName: data.ustazName || "N/A", jamiaName: data.jamiaName || "N/A", className: data.className || "N/A", region: data.region || "N/A", state: data.state || "N/A", total_amount: parseFloat(data.amount) || 0, daily_amount: parseFloat(data.daily_amount) || 0, photoUrl: data.photoUrl || null, timestamp: data.timestamp };
                    });
                    setAllData(parsedData); setIsLoading(false);
                });

                const unsubCustom = db.collection('custom_records').onSnapshot(snapshot => {
                    const records = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
                    setCustomRecords(records);
                });

                const unsubHeader = db.collection('settings').doc('dashboard').onSnapshot(doc => { if(doc.exists) setHeaderConfig(doc.data()); });
                const unsubTimer = db.collection('settings').doc('timer').onSnapshot(doc => { if(doc.exists) setTimerConfig(doc.data()); });
                const unsubComp = db.collection('competitions').orderBy('timestamp', 'desc').onSnapshot(snapshot => { setCompetitions(snapshot.docs.map(d => d.data())); });
                
                return () => { unsubSettings(); unsubAsatiza(); unsubCustom(); unsubHeader(); unsubTimer(); unsubComp(); };
            }, []);

            useEffect(() => {
                if (!timerConfig || !timerConfig.endTime) return;
                const interval = setInterval(() => {
                    const now = new Date().getTime(); const target = new Date(timerConfig.endTime).getTime(); const diff = target - now;
                    if (diff <= 0) {
                        setCountdownStr("Time Up!"); const delayMs = (timerConfig.delayMinutes || 0) * 60 * 1000;
                        if (now >= target + delayMs) setShowTop3(true); else setShowTop3(false);
                    } else {
                        setShowTop3(false);
                        const d = Math.floor(diff / (1000 * 60 * 60 * 24)); const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)); const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)); const s = Math.floor((diff % (1000 * 60)) / 1000);
                        let timeStr = ""; if(d > 0) timeStr += `${d}d `; timeStr += `${h}h ${m}m ${s}s`; setCountdownStr(timeStr);
                    }
                }, 1000);
                return () => clearInterval(interval);
            }, [timerConfig]);

            const topTabs = ['All Jamiaat', 'All Classes'];
            const endTabs = ['All Regions', 'Result', 'Muqabla'];
            const allTabs = [...new Set([...topTabs, ...availableClasses, ...endTabs])];

            const currentMode = headerConfig?.dashboardMode || 'total';
            const processedData = allData.map(d => {
                const activeAmt = currentMode === 'daily' ? d.daily_amount : d.total_amount;
                return { ...d, amount: activeAmt, units: (activeAmt / 7000).toFixed(1) };
            });

            const processedCustomData = customRecords.map(d => {
                const activeAmt = currentMode === 'daily' ? (d.daily_amount || 0) : (d.amount || 0);

                                                            if(isRank) return null;
                                                            
                                                            let val = it.recordData[h] || "-";
                                                            if(isUnit) val = <span className="font-['Bowlby_One_SC'] text-sky-500 text-lg">{it.units}</span>;
                                                            if(isAmount) val = <span className="font-['Bowlby_One_SC'] text-emerald-600 text-lg">₹{it.amount.toLocaleString('en-IN')}</span>;

                                                            return (
                                                                <div key={i} className="flex justify-between border-b border-slate-50 pb-1 items-center">
                                                                    <span className="text-xs font-bold text-slate-400 uppercase">{h}</span>
                                                                    <span className="font-semibold text-slate-700">{val}</span>
                                                                </div>
                                                            )
                                                        })}
                                                    </div>
                                                ) : isRegionView ? ( 
                                                    <div><div className="font-bold text-indigo-700 text-xl leading-tight mb-1 uppercase mt-4 pr-16">{it.region}</div>
                                                    <div className="mt-3 flex flex-col"><span className="text-3xl font-['Bowlby_One_SC'] text-sky-500 leading-none">{it.units}</span><span className="text-[10px] font-bold text-slate-400 tracking-widest uppercase mt-1">Total Units</span></div></div>
                                                ) : isClassView ? ( 
                                                    <div><div className="font-bold text-indigo-700 text-xl leading-tight mb-1 uppercase mt-4 pr-16">{it.className}</div>
                                                    <div className="mt-3 flex flex-col"><span className="text-3xl font-['Bowlby_One_SC'] text-sky-500 leading-none">{it.units}</span><span className="text-[10px] font-bold text-slate-400 tracking-widest uppercase mt-1">Total Units</span></div></div>
                                                ) : isJamiaView ? ( 
                                                    <div><div className="font-bold text-indigo-700 text-xl leading-tight mb-1 mt-4 pr-16">{it.jamiaName}</div>
                                                    <div className="mt-3 flex flex-col"><span className="text-3xl font-['Bowlby_One_SC'] text-sky-500 leading-none">{it.units}</span><span className="text-[10px] font-bold text-slate-400 tracking-widest uppercase mt-1">Total Units</span></div></div>
                                                ) : ( 
                                                    <div>
                                                        <div className="border-b pb-3 mb-3 mt-4 pr-16"><div className="font-bold text-slate-800 text-lg uppercase">{it.ustazName}{it.className !== activeTab && <span className="ml-2 text-[10px] text-white bg-indigo-500 px-1.5 py-0.5 rounded-full normal-case">Sec {it.className.slice(-1)}</span>}</div><div className="text-xs font-semibold text-indigo-500 mt-1">{it.jamiaName}</div></div>
                                                        <div className="grid grid-cols-3 gap-2 text-sm items-center">
                                                            <div className="col-span-1"><span className="block text-[10px] uppercase text-slate-400 font-bold tracking-wider">Region</span><span className="font-semibold text-slate-600">{it.region}</span></div>
                                                            <div className="col-span-2 flex flex-col items-end"><span className="text-2xl font-['Bowlby_One_SC'] text-emerald-600 leading-none mb-1">₹{it.amount.toLocaleString('en-IN')}</span><span className="text-xs font-bold text-sky-500 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">{it.units} Units</span></div>
                                                        </div>
                                                    </div> 
                                                )}
                                            </div>
                                        ))}
                                        {displayedData.length === 0 && !isLoading && ( <div className="text-slate-500 p-6 text-center text-sm font-medium bg-slate-50 rounded-xl border border-dashed border-slate-300">Data abhi mojood nahi hai.</div> )}
                                    </div>
                                </div>
                            )}
                        </main>
                        <footer className="mt-8 text-xs text-slate-400 text-center font-medium">Designed for Telethon 2026 — Majlis Talimi Umoor India</footer>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TelethoneDashboard />);
    </script>
</body>
</html>
