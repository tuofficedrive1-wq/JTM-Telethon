A MASJID GOVANDI": "Irfan Misbahi", "KHULDABAD": "Irfan Misbahi", "KORADI": "Irfan Misbahi", "LATUR": "Irfan Misbahi", "MAHIM": "Irfan Misbahi", "MALEGAON": "Irfan Misbahi", "MITTI MASJID GOVANDI": "Irfan Misbahi", "MODEL JAMIA": "Irfan Misbahi", "MUMBAI": "Irfan Misbahi", "NAGPUR": "Irfan Misbahi", "PUNE": "Irfan Misbahi", "SHAHADA": "Irfan Misbahi"};

        // --- Helper: Google Drive Link Convert ---
        function getDirectImageUrl(url) {
            if (!url) return "";
            if (url.includes("drive.google.com/file/d/")) {
                let fileId = url.split("/d/")[1].split("/")[0];
                return `https://drive.google.com/uc?export=view&id=${fileId}`;
            }
            return url;
        }

        // --- MAIN DASHBOARD COMPONENT ---
        function TelethoneDashboard() {
            // Tabs Options
            const allClasses = ['All Jamiaat', 'Hifz Class', 'Ibtidaiya', 'Sale Awwal', 'Sale Duwam', 'Ula', 'Saniya', 'Salisa', 'Rabia', 'Khamisa', 'Sadisa', 'Sabia', 'Doratul Hadis'];
            
            const [activeTab, setActiveTab] = useState("All Jamiaat");
            const [allData, setAllData] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [highlightKey, setHighlightKey] = useState(null);
            
            // Poster State
            const [posterData, setPosterData] = useState(null);
            const [isDownloading, setIsDownloading] = useState(false);
            const posterContainerRef = useRef(null);

            useEffect(() => {
                posterContainerRef.current = document.getElementById('poster-container');
                
                const unsubscribe = db.collection('asatiza_details')
                    .orderBy('timestamp', 'desc')
                    .onSnapshot(snapshot => {
                        const parsedData = snapshot.docs.map(doc => {
                            const data = doc.data();
                            const classWithSection = data.section ? `${data.className} (${data.section})` : data.className;
                            return {
                                id: doc.id,
                                ustazName: data.ustazName || "N/A",
                                jamiaName: data.jamiaName || "N/A",
                                zimmedarName: zimmedarList[data.jamiaName] || "N/A",
                                className: data.className || "N/A",
                                displayClass: classWithSection || "N/A",
                                region: data.region || "N/A",
                                state: data.state || "N/A",
                                photoUrl: getDirectImageUrl(data.photoUrl),
                                timestamp: data.timestamp
                            };
                        });
                        
                        setAllData(parsedData);
                        setIsLoading(false);
                    }, err => {
                        console.error("Firebase fetch error: ", err);
                        setIsLoading(false);
                    });

                return () => unsubscribe();
            }, []);

            // Handle Poster Generation
            useEffect(() => {
                if (!posterData) return;
                const generateImage = async () => {
                    await new Promise(resolve => setTimeout(resolve, 300)); // wait for DOM to update
                    const element = document.getElementById('poster-to-download');
                    if(element && window.html2canvas) {
                        try {
                            const canvas = await html2canvas(element, { useCORS: true, scale: 2, backgroundColor: null });
                            const dataUrl = canvas.toDataURL('image/png');
                            const link = document.createElement('a');
                            link.href = dataUrl;
                            link.download = `Telethon_2026_${posterData.className.replace(/\s+/g, '_')}_List.png`;
                            link.click();
                        } catch(err) {
                            console.error("Poster download error:", err);
                            alert("Poster banne mein koi masla aaya hai.");
                        } finally {
                            setPosterData(null);
                            setIsDownloading(false);
                        }
                    }
                };
                generateImage();
            }, [posterData]);

            const displayedData = (activeTab === "All Jamiaat" 
                ? allData 
                : allData.filter(d => d.className === activeTab)
            ).sort((a, b) => a.jamiaName.localeCompare(b.jamiaName)); // A-Z Sort by Jamia Name

            const handleDownloadPoster = () => {
                if(displayedData.length === 0) return;
                setIsDownloading(true);
                setPosterData({
                    className: activeTab,
                    items: displayedData
                });
            };

            const DownloadIcon = () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                  <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
                </svg>
            );

            return (
                <div className="min-h-screen bg-gray-50 pb-10">
                    {/* Render off-screen Poster */}
                    {posterData && ReactDOM.createPortal(<ListPoster data={posterData} />, posterContainerRef.current)}

                    <div className="max-w-7xl mx-auto p-4 sm:p-6">
                        
                        {/* Header */}
                        <header className="mb-6 text-center">
                             <h1 className="text-6xl sm:text-7xl font-['Bebas_Neue'] bg-clip-text text-transparent bg-gradient-to-r from-sky-500 to-indigo-600 tracking-wide">
                                TELETHON 2026
                            </h1>
                            <p className="text-xl sm:text-2xl font-['Bebas_Neue'] text-slate-600 tracking-widest mt-2">ASATIZA RECORD DASHBOARD</p>
                            <p className="text-sm text-slate-500 mt-2">Class-wise Live Registration Status</p>
                        </header>

                        {/* Class Tabs */}
                        <nav className="mb-6">
                            <div className="flex flex-wrap gap-2 justify-center">
                                {allClasses.map((opt) => (
                                    <button
                                        key={opt}
                                        onClick={() => setActiveTab(opt)}
                                        className={`tab-btn px-4 py-2 rounded-full font-semibold text-sm shadow-sm focus:outline-none ${ activeTab === opt ? "bg-indigo-600 text-white shadow-md scale-105" : "bg-white text-slate-600 border border-slate-200 hover:bg-slate-100" }`}
                                    >
                                        {opt}
                                    </button>
                                ))}
                            </div>
                        </nav>

                        {/* Main Content Box */}
                        <main className="bg-white border rounded-2xl p-4 sm:p-6 shadow-xl relative min-h-[400px]">
                            
                            {isLoading && (
                                <div className="absolute inset-0 bg-white/80 backdrop-blur-sm z-20 flex justify-center items-center rounded-2xl">
                                    <div className="flex flex-col items-center p-6">
                                        <div className="loader w-10 h-10 mb-4 border-t-indigo-500 border-4"></div>
                                        <span className="text-slate-500 font-semibold animate-pulse">Loading Data...</span>
                                    </div>
                                </div>
                            )}

                            {/* Section Title & Download Button */}
                            <div className="flex flex-col sm:flex-row justify-between items-center mb-6 border-b pb-4 gap-4">
                                <h2 className="text-2xl font-['Bowlby_One_SC'] text-indigo-900 uppercase flex items-center gap-3">
                                    {activeTab} 
                                    <span className="text-sm bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-['Inter'] font-bold tracking-normal">
                                        {displayedData.length} Teachers
                                    </span>
                                </h2>
                                <button 
                                    onClick={handleDownloadPoster} 
                                    disabled={isDownloading || displayedData.length === 0} 
                                    className="px-4 py-2 text-white bg-gradient-to-r from-sky-500 to-indigo-600 rounded-lg shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2 font-semibold transition"
                                >
                                    {isDownloading ? <div className="loader !w-4 !h-4 !border-2 !border-t-white"></div> : <DownloadIcon />} 
                                    Download Poster
                                </button>
                            </div>

                            {/* Table Structure (Desktop) */}
                            <div className="hidden md:block">
                                <div className="grid grid-cols-12 items-center px-4 py-3 border-b text-sm font-bold text-slate-500 bg-slate-50 rounded-t-xl uppercase tracking-wider">
                                    <div className="col-span-1">Sr.</div>
                                    <div className="col-span-1 text-center">Photo</div>
                                    <div className="col-span-3">Ustaz Name</div>
                                    <div className="col-span-3">Jamia Name</div>
                                    <div className="col-span-2">Zimmedar</div>
                                    <div className="col-span-2 text-right">Region</div>
                                </div>
                                <div className="space-y-2 mt-2">
                                    {displayedData.map((it, idx) => (
                                        <div key={it.id} className="grid grid-cols-12 items-center gap-4 p-3 rounded-xl bg-white border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
                                            <div className="col-span-1 font-bold text-slate-400 text-sm pl-2">{idx + 1}</div>
                                            <div className="col-span-1 flex justify-center">
                                                {it.photoUrl ? (
                                                    <img src={it.photoUrl} className="w-10 h-10 rounded-full object-cover border border-slate-200" alt="pic" />
                                                ) : (
                                                    <div className="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-[10px] text-slate-400">No Pic</div>
                                                )}
                                            </div>
                                            <div className="col-span-3 font-semibold text-slate-800">
                                                {it.ustazName}
                                                {activeTab === 'All Jamiaat' && <div className="text-xs text-indigo-500 mt-0.5">{it.displayClass}</div>}
                                            </div>
                                            <div className="col-span-3 font-bold text-indigo-600">{it.jamiaName}</div>
                                            <div className="col-span-2 text-sm font-medium text-slate-600 bg-slate-50 px-2 py-1 rounded-md w-fit border border-slate-200">{it.zimmedarName}</div>
                                            <div className="col-span-2 text-right">
                                                <div className="text-sm font-bold text-slate-700">{it.region}</div>
                                                <div className="text-xs text-slate-500">{it.state}</div>
                                            </div>
                                        </div>
                                    ))}
                                    {displayedData.length === 0 && !isLoading && (
                                        <div className="text-slate-500 p-8 text-center font-medium bg-slate-50 rounded-xl border border-dashed border-slate-300">
                                            Is class me abhi kisi ustad ki entry nahi aayi hai.
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Mobile Structure */}
                            <div className="md:hidden space-y-3">
                                {displayedData.map((it, idx) => (
                                    <div key={it.id} className="p-4 rounded-xl shadow-sm bg-white border border-slate-100">
                                        <div className="flex items-center gap-3 border-b pb-3 mb-3">
                                            {it.photoUrl ? (
                                                <img src={it.photoUrl} className="w-12 h-12 rounded-full object-cover border-2 border-indigo-100" alt="pic" />
                                            ) : (
                                                <div className="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-xs text-slate-400 border-2 border-slate-200">Pic</div>
                                            )}
                                            <div>
                                                <div className="font-bold text-slate-800 flex items-center gap-2">
                                                    <span className="text-indigo-400 text-sm">{idx + 1}.</span> 
                                                    {it.ustazName}
                                                </div>
                                                <div className="text-xs font-semibold text-indigo-500">{activeTab === 'All Jamiaat' ? it.displayClass : it.zimmedarName}</div>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-2 text-sm">
                                            <div>
                                                <span className="block text-[10px] uppercase text-slate-400 font-bold tracking-wider">Jamia</span>
                                                <span className="font-bold text-slate-700">{it.jamiaName}</span>
                                            </div>
                                            <div className="text-right">
                                                <span className="block text-[10px] uppercase text-slate-400 font-bold tracking-wider">Region</span>
                                                <span className="font-semibold text-slate-600">{it.region}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                {displayedData.length === 0 && !isLoading && (
                                    <div className="text-slate-500 p-6 text-center text-sm font-medium bg-slate-50 rounded-xl border border-dashed border-slate-300">
                                        Is class me abhi kisi ki entry nahi hai.
                                    </div>
                                )}
                            </div>

                        </main>
                        
                        <footer className="mt-8 text-xs text-slate-400 text-center font-medium">
                            Designed for Telethon 2026 — Majlis Talimi Umoor India
                        </footer>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TelethoneDashboard />);
    </script>
</body>
</html>
